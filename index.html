/* =========================

========================= */

========================= */

<script>

/* =====================================================
   GOOGLE HUB v6
   Designed for simple / older WebViews
===================================================== */


/* =====================================================
   CLOCK
===================================================== */

function updateClock() {

    var now = new Date();

    var hours = now.getHours();
    var minutes = now.getMinutes();

    if (hours < 10) {
        hours = "0" + hours;
    }

    if (minutes < 10) {
        minutes = "0" + minutes;
    }

    document.getElementById("clock").innerHTML =
        hours + ":" + minutes;
}

updateClock();

setInterval(
    updateClock,
    1000
);


/* =====================================================
   PANEL CONTROL
===================================================== */

function hideAllPanels() {

    document.getElementById(
        "favoriteForm"
    ).className = "panel hidden";

    document.getElementById(
        "favoritesPanel"
    ).className = "panel hidden";

    document.getElementById(
        "historyPanel"
    ).className = "panel hidden";
}


/* =====================================================
   SAFE URL
===================================================== */

function makeURL(url) {

    url = String(url);

    url = url.replace(
        /^\s+|\s+$/g,
        ""
    );

    if (url === "") {
        return "";
    }

    if (
        url.indexOf("http://") !== 0 &&
        url.indexOf("https://") !== 0
    ) {
        url = "https://" + url;
    }

    return url;
}


/* =====================================================
   OPEN URL
===================================================== */

function openURL(url) {

    if (!url) {
        return;
    }

    window.location.href = url;
}


/* =====================================================
   HISTORY STORAGE
===================================================== */

function getHistory() {

    try {

        var data =
            window.localStorage.getItem(
                "googleHubHistory"
            );

        if (!data) {
            return [];
        }

        var list = JSON.parse(data);

        if (!list || !list.length) {
            return [];
        }

        return list;

    } catch (error) {

        return [];
    }
}


function saveHistory(url) {

    try {

        var list =
            getHistory();

        var newList = [];

        var i;

        newList.push(url);

        for (
            i = 0;
            i < list.length;
            i++
        ) {

            if (
                list[i] !== url
            ) {
                newList.push(
                    list[i]
                );
            }
        }

        if (
            newList.length > 20
        ) {
            newList =
                newList.slice(
                    0,
                    20
                );
        }

        window.localStorage.setItem(
            "googleHubHistory",
            JSON.stringify(
                newList
            )
        );

    } catch (error) {

        /* Storage unavailable */
    }
}


/* =====================================================
   FAVORITES STORAGE
===================================================== */

function getFavorites() {

    try {

        var data =
            window.localStorage.getItem(
                "googleHubFavorites"
            );

        if (!data) {
            return [];
        }

        var list =
            JSON.parse(data);

        if (!list || !list.length) {
            return [];
        }

        return list;

    } catch (error) {

        return [];
    }
}


function saveFavorites(list) {

    try {

        window.localStorage.setItem(
            "googleHubFavorites",
            JSON.stringify(list)
        );

        return true;

    } catch (error) {

        return false;
    }
}


/* =====================================================
   ADD FAVORITE
===================================================== */

function showFavoriteForm() {

    hideAllPanels();

    document.getElementById(
        "favoriteForm"
    ).className = "panel";

    document.getElementById(
        "favoriteName"
    ).value = "";

    document.getElementById(
        "favoriteURL"
    ).value = "";

}


/* =====================================================
   CANCEL FAVORITE
===================================================== */

function cancelFavorite() {

    document.getElementById(
        "favoriteForm"
    ).className = "panel hidden";
}


/* =====================================================
   SAVE FAVORITE
===================================================== */

function saveFavorite() {

    var name =
        document.getElementById(
            "favoriteName"
        ).value;

    var url =
        document.getElementById(
            "favoriteURL"
        ).value;

    name = name.replace(
        /^\s+|\s+$/g,
        ""
    );

    url = makeURL(url);

    if (name === "") {

        document.getElementById(
            "favoriteName"
        ).focus();

        return;
    }

    if (url === "") {

        document.getElementById(
            "favoriteURL"
        ).focus();

        return;
    }


    var list =
        getFavorites();


    /* Prevent duplicates */

    var i;

    for (
        i = 0;
        i < list.length;
        i++
    ) {

        if (
            list[i].url === url
        ) {

            list[i].name =
                name;

            saveFavorites(
                list
            );

            showFavorites();

            return;
        }
    }


    /* Add new favorite */

    list.push({

        name: name,

        url: url

    });


    if (
        saveFavorites(list)
    ) {

        document.getElementById(
            "favoriteForm"
        ).className =
            "panel hidden";

        showFavorites();

    } else {

        document.getElementById(
            "favoriteForm"
        ).className =
            "panel";

        alert(
            "Favorites storage is not available."
        );
    }
}


/* =====================================================
   DELETE FAVORITE
===================================================== */

function deleteFavorite(index) {

    var list =
        getFavorites();

    if (
        index < 0 ||
        index >= list.length
    ) {
        return;
    }

    list.splice(
        index,
        1
    );

    saveFavorites(
        list
    );

    showFavorites();
}


/* =====================================================
   SHOW FAVORITES
===================================================== */

function showFavorites() {

    hideAllPanels();

    document.getElementById(
        "favoritesPanel"
    ).className =
        "panel";

    var list =
        getFavorites();

    var container =
        document.getElementById(
            "favoritesList"
        );

    container.innerHTML = "";


    if (
        list.length === 0
    ) {

        container.innerHTML =
            '<div class="message">' +
            '⭐ No favorites yet.' +
            '</div>';

        return;
    }


    var i;

    for (
        i = 0;
        i < list.length;
        i++
    ) {

        var item =
            document.createElement(
                "div"
            );

        item.className =
            "item";


        var link =
            document.createElement(
                "a"
            );

        link.href =
            list[i].url;

        link.innerHTML =
            "⭐ " +
            list[i].name;


        var deleteButton =
            document.createElement(
                "button"
            );

        deleteButton.className =
            "deleteButton";

        deleteButton.innerHTML =
            "✕";

        deleteButton.setAttribute(
            "data-index",
            i
        );


        deleteButton.onclick =
            function() {

                var index =
                    parseInt(
                        this.getAttribute(
                            "data-index"
                        ),
                        10
                    );

                deleteFavorite(
                    index
                );
            };


        item.appendChild(
            link
        );

        item.appendChild(
            deleteButton
        );

        container.appendChild(
            item
        );
    }
}


/* =====================================================
   HISTORY PANEL
===================================================== */

function showHistory() {

    hideAllPanels();

    document.getElementById(
        "historyPanel"
    ).className =
        "panel";

    var list =
        getHistory();

    var container =
        document.getElementById(
            "historyList"
        );

    container.innerHTML = "";


    if (
        list.length === 0
    ) {

        container.innerHTML =
            '<div class="message">' +
            '🕘 History is empty.' +
            '</div>';

        return;
    }


    var i;

    for (
        i = 0;
        i < list.length;
        i++
    ) {

        var item =
            document.createElement(
                "div"
            );

        item.className =
            "item";


        var link =
            document.createElement(
                "a"
            );

        link.href =
            list[i];

        link.innerHTML =
            "🕘 " +
            list[i];


        item.appendChild(
            link
        );

        container.appendChild(
            item
        );
    }
}


/* =====================================================
   CLEAR HISTORY
===================================================== */

function clearHistory() {

    try {

        window.localStorage.removeItem(
            "googleHubHistory"
        );

    } catch (error) {}

    showHistory();
}


/* =====================================================
   GOOGLE SEARCH
===================================================== */

function googleSearch() {

    var query =
        document.getElementById(
            "searchBox"
        ).value;

    query =
        query.replace(
            /^\s+|\s+$/g,
            ""
        );

    if (
        query === ""
    ) {
        return;
    }


    var url =
        "https://www.google.com/search?q=" +
        encodeURIComponent(
            query
        );


    saveHistory(
        url
    );

    openURL(
        url
    );
}


/* =====================================================
   BROWSER
===================================================== */

function browserGo() {

    var url =
        document.getElementById(
            "urlBox"
        ).value;

    url =
        makeURL(
            url
        );

    if (
        url === ""
    ) {
        return;
    }

    saveHistory(
        url
    );

    openURL(
        url
    );
}


/* =====================================================
   BUTTON EVENTS
===================================================== */

document.getElementById(
    "searchButton"
).onclick =
    function() {

        googleSearch();

    };


document.getElementById(
    "searchBox"
).onkeydown =
    function(event) {

        event =
            event ||
            window.event;

        if (
            event.keyCode === 13
        ) {
            googleSearch();
        }

    };


document.getElementById(
    "favoritesButton"
).onclick =
    function() {

        showFavorites();

    };


document.getElementById(

document.getElementById(

).onclick =

document.getElementById(

).onclick =

document.getElementById(

).onclick =
    function() {

document.getElementById(

    function() {

    };


document.getElementById(
    "urlBox"
).onkeydown =
    function(event) {

        event =
            event ||
            window.event;

        if (
            event.keyCode === 13
        ) {
            browserGo();
        }

    };
