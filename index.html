<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0">

<title>Nokia Browser</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    text-align: center;
}

.main {
    width: 100%;
    padding: 26px 12px 18px 12px;
}


/* Google Logo */

.logo {
    font-size: 46px;
    font-weight: bold;
    letter-spacing: -4px;
    line-height: 1;
    white-space: nowrap;
    margin-bottom: 28px;
}

.blue {
    color: #4285F4;
}

.red {
    color: #EA4335;
}

.yellow {
    color: #FBBC05;
}

.green {
    color: #34A853;
}


/* Search Box */

.search-box {
    width: 100%;
    height: 48px;

    border: 1px solid #5f6368;
    border-radius: 24px;

    background: #202124;

    display: flex;
    align-items: center;

    padding: 0 10px;
}


/* Search Input */

#search {
    width: 100%;
    height: 42px;

    border: none;
    outline: none;

    font-size: 16px;

    background: transparent;
    color: #fff;

    order: 1;
}

#search::placeholder {
    color: #aaa;
}


/* Search Button */

.search-button {
    width: 34px;
    height: 34px;

    border: none;
    background: transparent;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 0;
    margin-left: 5px;

    order: 2;

    cursor: pointer;
}

.search-button svg {
    width: 21px;
    height: 21px;

    fill: none;
    stroke: #aaa;
    stroke-width: 2.5;
}

.search-button:active svg {
    stroke: #fff;
}


/* Clock */

#clock {
    font-size: 20px;
    color: #fff;

    margin-top: 18px;
}


/* Nokia Area */

.nokia-box {
    margin-top: 18px;

    padding-top: 12px;

    border-top: 1px solid #222;
}

.nokia-title {
    font-size: 13px;

    color: #777;

    letter-spacing: 1px;
}

.info {
    margin-top: 5px;

    font-size: 10px;

    color: #444;
}

</style>

</head>


<body>


<div class="main">


    <!-- Google Logo -->

    <div class="logo">

        <span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span>

    </div>


    <!-- Search Box -->

    <div class="search-box">


        <input
            id="search"
            type="text"
            placeholder="Search or enter website"
            onkeydown="searchKey(event)"
        >


        <button
            class="search-button"
            onclick="openSearch()"
            aria-label="Search">


            <svg viewBox="0 0 24 24">

                <circle
                    cx="10.5"
                    cy="10.5"
                    r="6.5">
                </circle>

                <line
                    x1="16"
                    y1="16"
                    x2="21"
                    y2="21">
                </line>

            </svg>


        </button>


    </div>


    <!-- Clock -->

    <div id="clock">
        00:00:00
    </div>


    <!-- Nokia -->

    <div class="nokia-box">

        <div class="nokia-title">
            NOKIA 3210 4G
        </div>

        <div class="info">
            MINI BROWSER
        </div>

    </div>


</div>



<script>


/* Search / Open Website */

function openSearch() {

    var text =
        document.getElementById(
            "search"
        ).value;


    text =
        text.replace(
            /^\s+|\s+$/g,
            ""
        );


    if (text == "") {
        return;
    }


    /* Website */

    var isWebsite =
        text.indexOf(".") > 0 ||
        text.indexOf("://") > 0;


    if (isWebsite) {

        var url = text;


        if (
            url.indexOf("://") == -1
        ) {

            url =
                "https://" + url;

        }


        window.location.href = url;


    } else {


        /* Google Search */

        window.location.href =
            "https://www.google.com/search?q=" +
            encodeURIComponent(text);

    }

}


/* Enter Key */

function searchKey(event) {

    if (event.keyCode == 13) {

        openSearch();

    }

}


/* Clock */

function updateClock() {

    var now = new Date();

    var h = now.getHours();
    var m = now.getMinutes();
    var s = now.getSeconds();


    if (h < 10) {
        h = "0" + h;
    }

    if (m < 10) {
        m = "0" + m;
    }

    if (s < 10) {
        s = "0" + s;
    }


    document.getElementById(
        "clock"
    ).innerHTML =
        h + ":" + m + ":" + s;

}


updateClock();


setInterval(
    updateClock,
    1000
);

</script>


</body>
</html>
