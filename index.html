<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nokia Browser</title>
<style>
body{font-family:Arial;text-align:center;padding:20px 8px}
h2{color:#4285f4}
input{width:95%;padding:12px;box-sizing:border-box;font-size:15px;border:1px solid #aaa;border-radius:20px}
button{margin:12px;padding:10px 30px;background:#4285f4;color:white;border:0;border-radius:20px}
</style>
</head>
<body>
<h2>Nokia Browser</h2>
<form action="https://www.google.com/search" method="get">
<input name="q" id="q" placeholder="Search or enter website" required>
<br>
<button type="button" onclick="
var x=document.getElementById('q').value.trim();
if(x.indexOf('.')>0 && x.indexOf(' ')<0){
if(x.indexOf('://')<0)x='https://'+x;
window.location.href=x;
}else{
window.location.href='https://www.google.com/search?q='+encodeURIComponent(x);
}">
Go</button>
</form>
</body>
</html>
