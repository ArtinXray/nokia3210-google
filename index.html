<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Google Search</title>

<style>
html,body{
  margin:0;
  padding:0;
  background:#fff;
  color:#111;
  font-family:Arial,sans-serif;
  font-size:16px;
}

body{
  padding:10px;
  box-sizing:border-box;
}

h1{
  font-size:20px;
  margin:0 0 12px;
}

input{
  width:100%;
  box-sizing:border-box;
  height:42px;
  font-size:16px;
  padding:6px;
}

button{
  width:100%;
  height:42px;
  margin-top:8px;
  font-size:16px;
}
</style>
</head>

<body>

<h1>جستجوی Google</h1>

<form action="https://www.google.com/search" method="get">
  <input
    name="q"
    type="search"
    placeholder="عبارت جستجو"
    autocomplete="off">
    
  <button type="submit">جستجو</button>
</form>

</body>
</html>
