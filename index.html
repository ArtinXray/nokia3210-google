<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0">

<title>Google</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 12px;

    background: #111;
    color: white;

    font-family: Arial, sans-serif;
    text-align: center;
}


/* =========================
   Google Logo
========================= */

.logo {
    font-family: Arial, sans-serif;

    font-size: 58px;

    font-weight: bold;

    letter-spacing: -5px;

    margin-top: 5px;
    margin-bottom: 8px;

    line-height: 1;
}

.blue {
    color: #4285F4;
}

.red {
    color: #EA4335;
}

.yellow {
    color: #FBBC05;
}

.green {
    color: #34A853;
}


/* =========================
   Clock
========================= */

#clock {
    font-size: 20px;
    margin-bottom: 8px;
}


/* =========================
   Phone
========================= */

.info {
    font-size: 15px;

    color: #aaa;

    margin-bottom: 15px;
}


/* =========================
   Line
========================= */

.line {
    height: 1px;

    background: #333;

    margin: 16px 0;
}


/* =========================
   Input
========================= */

input {
    display: block;

    width: 100%;

    height: 48px;

    padding: 8px 12px;

    margin: 8px 0;

    background: #1d1d1d;

    color: white;

    border: 1px solid #555;

    border-radius: 7px;

    font-size: 16px;
}


/* =========================
   Buttons
========================= */

button {
    display: block;

    width: 100%;

    height: 50px;

    margin: 9px 0;

    background: #222;

    color: white;

    border: 1px solid #666;

    border-radius: 7px;

    font-size: 17px;

    font-weight: bold;
}


button:active {
    background: #444;
}


/* =========================
   Footer
========================= */

.footer {
    margin-top: 18px;

    color: #666;

    font-size: 12px;
}

</style>

</head>


<body>


<!-- =========================
     Google Logo
========================= -->

<div class="logo">

    <span class="blue">G</span>
    <span class="red">o</span>
    <span class="yellow">o</span>
    <span class="blue">g</span>
    <span class="green">l</span>
    <span class="red">e</span>

</div>


<!-- Clock -->

<div id="clock">
    00:00:00
</div>


<!-- Phone -->

<div class="info">
    📱 Nokia 3210 4G
</div>


<div class="line"></div>


<!-- Google Search -->

<input
    id="search"
    type="text"
    placeholder="Search Google"
>

<button onclick="searchGoogle()">
    🔎 Search Google
</button>


<div class="line"></div>


<!-- Website -->

<input
    id="url"
    type="text"
    placeholder="Website URL"
>

<button onclick="openWebsite()">
    🌐 Open Website
</button>


<div class="line"></div>


<!-- Google -->

<button onclick="openGoogle()">
    🔵 Google
</button>


<!-- Wikipedia -->

<button onclick="openWikipedia()">
    📚 Wikipedia
</button>


<!-- Back -->

<button onclick="goBack()">
    ◀️ Back
</button>


<div class="footer">
    Google
</div>



<script>


/* =========================
   Google Search
========================= */

function searchGoogle() {

    var text =
        document.getElementById(
            "search"
        ).value;

    if (text == "") {
        return;
    }

    window.location.href =
        "https://www.google.com/search?q=" +
        encodeURIComponent(text);
}


/* =========================
   Open Website
========================= */

function openWebsite() {

    var url =
        document.getElementById(
            "url"
        ).value;

    if (url == "") {
        return;
    }

    if (
        url.indexOf("http://") != 0 &&
        url.indexOf("https://") != 0
    ) {

        url =
            "https://" + url;
    }

    window.location.href = url;
}


/* =========================
   Google
========================= */

function openGoogle() {

    window.location.href =
        "https://www.google.com/";
}


/* =========================
   Wikipedia
========================= */

function openWikipedia() {

    window.location.href =
        "https://www.wikipedia.org/";
}


/* =========================
   Back
========================= */

function goBack() {

    history.back();
}


/* =========================
   Clock
========================= */

function updateClock() {

    var now = new Date();

    var h = now.getHours();
    var m = now.getMinutes();
    var s = now.getSeconds();


    if (h < 10) {
        h = "0" + h;
    }

    if (m < 10) {
        m = "0" + m;
    }

    if (s < 10) {
        s = "0" + s;
    }


    document.getElementById(
        "clock"
    ).innerHTML =
        h + ":" + m + ":" + s;
}


updateClock();


setInterval(
    updateClock,
    1000
);

</script>


</body>
</html>
