<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<title>Google Hub</title>

<style>

body {
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:10px;
}

h1 {
    font-size:22px;
}

#clock {
    font-size:18px;
    margin:10px;
}

input {
    width:90%;
    padding:10px;
    margin:5px;
    box-sizing:border-box;
}

button {
    width:90%;
    padding:10px;
    margin:5px;
    background:#222;
    color:white;
    border:1px solid #555;
    border-radius:5px;
}

</style>
</head>

<body>

<h1>🌐 GOOGLE HUB</h1>

<div id="clock">00:00:00</div>

<p>Nokia 3210 4G</p>


<!-- Google Search -->

<input
    id="search"
    type="text"
    placeholder="Search Google"
>

<button onclick="searchGoogle()">
    🔎 Search
</button>


<!-- Website -->

<input
    id="url"
    type="text"
    placeholder="Website URL"
>

<button onclick="openWebsite()">
    🌐 Open Website
</button>


<!-- Google -->

<button onclick="openGoogle()">
    Google
</button>


<!-- Wikipedia -->

<button onclick="openWikipedia()">
    Wikipedia
</button>


<!-- Back -->

<button onclick="goBack()">
    ◀ Back
</button>


<script>

function searchGoogle() {

    var text =
        document.getElementById("search").value;

    if (text == "") return;

    window.location.href =
        "https://www.google.com/search?q=" +
        encodeURIComponent(text);
}


function openWebsite() {

    var url =
        document.getElementById("url").value;

    if (url == "") return;

    if (
        url.indexOf("http://") != 0 &&
        url.indexOf("https://") != 0
    ) {

        url = "https://" + url;
    }

    window.location.href = url;
}


function openGoogle() {

    window.location.href =
        "https://www.google.com/";
}


function openWikipedia() {

    window.location.href =
        "https://www.wikipedia.org/";
}


function goBack() {

    history.back();
}


/* Clock */

function updateClock() {

    var now = new Date();

    var h = now.getHours();
    var m = now.getMinutes();
    var s = now.getSeconds();

    if (h < 10) h = "0" + h;
    if (m < 10) m = "0" + m;
    if (s < 10) s = "0" + s;

    document.getElementById("clock").innerHTML =
        h + ":" + m + ":" + s;
}

updateClock();

setInterval(
    updateClock,
    1000
);

</script>

</body>
</html>
