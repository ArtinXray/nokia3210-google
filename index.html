<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Google Hub</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #101010;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.header {
    background: #202020;
    border-bottom: 1px solid #444;
    padding: 9px 4px;
    font-size: 19px;
    font-weight: bold;
}

.clock {
    padding: 4px;
    font-size: 13px;
    color: #ccc;
}

.status {
    font-size: 10px;
    color: #777;
}

.container {
    padding: 7px;
}

.section {
    margin-top: 12px;
    margin-bottom: 5px;
    text-align: left;
    color: #999;
    font-size: 11px;
}

button {
    display: block;
    width: 100%;
    margin: 6px 0;
    padding: 10px 4px;
    background: #202020;
    color: white;
    border: 1px solid #555;
    border-radius: 5px;
    font-size: 15px;
}

button:active {
    background: #444;
}

input {
    width: 100%;
    padding: 10px;
    margin: 5px 0;
    background: #181818;
    color: white;
    border: 1px solid #555;
    border-radius: 5px;
    font-size: 14px;
}

.smallButton {
    display: inline-block;
    width: 48%;
}

.item {
    text-align: left;
    padding: 9px;
    margin: 5px 0;
    background: #1c1c1c;
    border: 1px solid #444;
    border-radius: 5px;
    font-size: 13px;
}

.item a {
    color: white;
    text-decoration: none;
}

.footer {
    margin: 15px 0;
    font-size: 10px;
    color: #666;
}

.hidden {
    display: none;
}
</style>
</head>

<body>

<div class="header">
    🌐 GOOGLE HUB
</div>

<div class="clock" id="clock">
    00:00
</div>

<div class="status">
    📱 Nokia 3210 4G • TA-1618
</div>

<div class="container">

    <!-- SEARCH -->

    <div class="section">
        🔎 SEARCH
    </div>

    <input
        id="searchBox"
        type="text"
        placeholder="Search Google..."
        onkeydown="searchKey(event)"
    >

    <button onclick="googleSearch()">
        🔍 Search Google
    </button>


    <!-- FAVORITES -->

    <div class="section">
        ⭐ FAVORITES
    </div>

    <button onclick="showFavorites()">
        ⭐ Open Favorites
    </button>

    <button onclick="addFavorite()">
        ➕ Add Favorite
    </button>


    <!-- BROWSER -->

    <div class="section">
        🌐 BROWSER
    </div>

    <input
        id="urlBox"
        type="text"
        placeholder="Enter website..."
        onkeydown="urlKey(event)"
    >

    <button onclick="openURL()">
        🚀 Go
    </button>


    <!-- GOOGLE -->

    <div class="section">
        🔵 GOOGLE
    </div>

    <button onclick="openSite('https://www.google.com/search')">
        🔍 Google Search
    </button>

    <button onclick="openSite('https://images.google.com')">
        🖼️ Google Images
    </button>

    <button onclick="openSite('https://news.google.com')">
        📰 Google News
    </button>

    <button onclick="openSite('https://translate.google.com')">
        🌐 Google Translate
    </button>

    <button onclick="openSite('https://www.google.com/search?q=weather')">
        🌤️ Google Weather
    </button>


    <!-- OTHER -->

    <div class="section">
        🌍 OTHER
    </div>

    <button onclick="openSite('https://www.wikipedia.org')">
        📚 Wikipedia
    </button>


    <!-- HISTORY -->

    <div class="section">
        🕘 HISTORY
    </div>

    <button onclick="showHistory()">
        🕘 View History
    </button>

    <button onclick="clearHistory()">
        🗑️ Clear History
    </button>


    <!-- CONTROLS -->

    <div class="section">
        ⚙️ CONTROLS
    </div>

    <button onclick="refreshPage()">
        🔄 Refresh
    </button>

    <button onclick="goBack()">
        ◀️ Back
    </button>


    <!-- FAVORITES PANEL -->

    <div id="favoritesPanel" class="hidden">

        <div class="section">
            ⭐ SAVED FAVORITES
        </div>

        <div id="favoritesList"></div>

        <button onclick="hidePanels()">
            ◀ Back
        </button>

    </div>


    <!-- HISTORY PANEL -->

    <div id="historyPanel" class="hidden">

        <div class="section">
            🕘 BROWSING HISTORY
        </div>

        <div id="historyList"></div>

        <button onclick="hidePanels()">
            ◀ Back
        </button>

    </div>

</div>

<div class="footer">
    ⭐ Google Hub v4
</div>


<script>

/* =========================
   CLOCK
========================= */

function updateClock() {

    var now = new Date();

    var h = String(now.getHours()).padStart(2, "0");
    var m = String(now.getMinutes()).padStart(2, "0");

    document.getElementById("clock").innerHTML =
        h + ":" + m;
}

setInterval(updateClock, 1000);
updateClock();


/* =========================
   OPEN WEBSITE
========================= */

function openSite(url) {

    saveHistory(url);

    window.location.href = url;
}


/* =========================
   GOOGLE SEARCH
========================= */

function googleSearch() {

    var query =
        document.getElementById("searchBox").value.trim();

    if (!query) {
        return;
    }

    var url =
        "https://www.google.com/search?q=" +
        encodeURIComponent(query);

    saveHistory(url);

    window.location.href = url;
}


function searchKey(event) {

    if (event.key === "Enter") {
        googleSearch();
    }
}


/* =========================
   BROWSER
========================= */

function openURL() {

    var url =
        document.getElementById("urlBox").value.trim();

    if (!url) {
        return;
    }

    if (
        !url.startsWith("http://") &&
        !url.startsWith("https://")
    ) {
        url = "https://" + url;
    }

    saveHistory(url);

    window.location.href = url;
}


function urlKey(event) {

    if (event.key === "Enter") {
        openURL();
    }
}


/* =========================
   FAVORITES
========================= */

function getFavorites() {

    var data =
        localStorage.getItem("googleHubFavorites");

    if (!data) {
        return [];
    }

    return JSON.parse(data);
}


function saveFavorites(list) {

    localStorage.setItem(
        "googleHubFavorites",
        JSON.stringify(list)
    );
}


function addFavorite() {

    var name =
        prompt("Favorite name:");

    if (!name) {
        return;
    }

    var url =
        prompt("Website URL:");

    if (!url) {
        return;
    }

    if (
        !url.startsWith("http://") &&
        !url.startsWith("https://")
    ) {
        url = "https://" + url;
    }

    var list = getFavorites();

    list.push({
        name: name,
        url: url
    });

    saveFavorites(list);

    alert("Favorite saved!");
}


function showFavorites() {

    hidePanels();

    document.getElementById(
        "favoritesPanel"
    ).classList.remove("hidden");

    var list = getFavorites();

    var html = "";

    if (list.length === 0) {

        html =
            '<div class="item">No favorites yet.</div>';

    } else {

        for (var i = 0; i < list.length; i++) {

            html +=
                '<div class="item">' +
                '⭐ <a href="' +
                list[i].url +
                '">' +
                list[i].name +
                '</a>' +
                '</div>';
        }
    }

    document.getElementById(
        "favoritesList"
    ).innerHTML = html;
}


/* =========================
   HISTORY
========================= */

function getHistory() {

    var data =
        localStorage.getItem("googleHubHistory");

    if (!data) {
        return [];
    }

    return JSON.parse(data);
}


function saveHistory(url) {

    var list = getHistory();

    list.unshift(url);

    if (list.length > 20) {
        list = list.slice(0, 20);
    }

    localStorage.setItem(
        "googleHubHistory",
        JSON.stringify(list)
    );
}


function showHistory() {

    hidePanels();

    document.getElementById(
        "historyPanel"
    ).classList.remove("hidden");

    var list = getHistory();

    var html = "";

    if (list.length === 0) {

        html =
            '<div class="item">History is empty.</div>';

    } else {

        for (var i = 0; i < list.length; i++) {

            html +=
                '<div class="item">' +
                '🕘 <a href="' +
                list[i] +
                '">' +
                list[i] +
                '</a>' +
                '</div>';
        }
    }

    document.getElementById(
        "historyList"
    ).innerHTML = html;
}


function clearHistory() {

    localStorage.removeItem(
        "googleHubHistory"
    );

    alert("History cleared!");
}


/* =========================
   PANELS
========================= */

function hidePanels() {

    document.getElementById(
        "favoritesPanel"
    ).classList.add("hidden");

    document.getElementById(
        "historyPanel"
    ).classList.add("hidden");
}


/* =========================
   CONTROLS
========================= */

function refreshPage() {
    location.reload();
}


function goBack() {

    if (history.length > 1) {

        history.back();

    } else {

        window.location.href =
            "https://artinxray.github.io/nokia3210-google/";
    }
}

</script>

</body>
</html>
