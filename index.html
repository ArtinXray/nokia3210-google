<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0">

<title>Google</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;

    background: #000;
    color: #fff;

    font-family: Arial, sans-serif;

    text-align: center;
}


/* =========================
   Main
========================= */

.main {
    width: 100%;

    padding: 30px 12px 20px 12px;
}


/* =========================
   Google Logo
========================= */

.logo {
    font-family: Arial, sans-serif;

    font-size: 48px;

    font-weight: bold;

    letter-spacing: -4px;

    line-height: 1;

    white-space: nowrap;

    margin-bottom: 30px;
}

.blue {
    color: #4285F4;
}

.red {
    color: #EA4335;
}

.yellow {
    color: #FBBC05;
}

.green {
    color: #34A853;
}


/* =========================
   Search Box
========================= */

.search-box {
    width: 100%;

    height: 48px;

    border: 1px solid #5f6368;

    border-radius: 24px;

    background: #202124;

    display: flex;

    align-items: center;

    padding: 0 14px;
}


.search-icon {
    font-size: 17px;

    margin-right: 8px;

    color: #aaa;
}


#search {
    width: 100%;

    height: 42px;

    border: none;

    outline: none;

    font-size: 16px;

    background: transparent;

    color: #fff;
}


#search::placeholder {
    color: #aaa;
}


/* =========================
   Clock
========================= */

#clock {
    font-size: 20px;

    color: #fff;

    margin-top: 18px;
}


/* =========================
   Phone
========================= */

.info {
    margin-top: 6px;

    font-size: 12px;

    color: #777;
}

</style>

</head>


<body>


<div class="main">


<!-- Google Logo -->

<div class="logo">

    <span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span>

</div>


<!-- Search -->

<div class="search-box">

    <span class="search-icon">🔍</span>

    <input
        id="search"
        type="text"
        placeholder="Search Google"
        onkeydown="searchKey(event)"
    >

</div>


<!-- Clock -->

<div id="clock">
    00:00:00
</div>


<!-- Phone -->

<div class="info">
    Nokia 3210 4G
</div>


</div>



<script>


/* =========================
   Search
========================= */

function searchGoogle() {

    var text =
        document.getElementById(
            "search"
        ).value;

    text =
        text.replace(
            /^\s+|\s+$/g,
            ""
        );

    if (text == "") {
        return;
    }

    window.location.href =
        "https://www.google.com/search?q=" +
        encodeURIComponent(text);
}


/* =========================
   Enter Key
========================= */

function searchKey(event) {

    if (
        event.keyCode == 13
    ) {

        searchGoogle();
    }
}


/* =========================
   Clock
========================= */

function updateClock() {

    var now = new Date();

    var h = now.getHours();

    var m = now.getMinutes();

    var s = now.getSeconds();


    if (h < 10) {
        h = "0" + h;
    }

    if (m < 10) {
        m = "0" + m;
    }

    if (s < 10) {
        s = "0" + s;
    }


    document.getElementById(
        "clock"
    ).innerHTML =
        h + ":" + m + ":" + s;
}


updateClock();


setInterval(
    updateClock,
    1000
);

</script>


</body>
</html>
