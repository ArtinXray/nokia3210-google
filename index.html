<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Google Hub v5</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #101010;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.header {
    background: #202020;
    border-bottom: 1px solid #444;
    padding: 9px 4px;
    font-size: 19px;
    font-weight: bold;
}

.clock {
    padding: 4px;
    font-size: 13px;
    color: #ccc;
}

.status {
    font-size: 10px;
    color: #777;
}

.container {
    padding: 7px;
}

.section {
    margin-top: 12px;
    margin-bottom: 5px;
    text-align: left;
    color: #999;
    font-size: 11px;
}

button {
    display: block;
    width: 100%;
    margin: 6px 0;
    padding: 10px 4px;
    background: #202020;
    color: white;
    border: 1px solid #555;
    border-radius: 5px;
    font-size: 15px;
}

button:active {
    background: #444;
}

input {
    width: 100%;
    padding: 10px;
    margin: 5px 0;
    background: #181818;
    color: white;
    border: 1px solid #555;
    border-radius: 5px;
    font-size: 14px;
}

.item {
    text-align: left;
    padding: 9px;
    margin: 5px 0;
    background: #1c1c1c;
    border: 1px solid #444;
    border-radius: 5px;
    font-size: 13px;
}

.item a {
    color: white;
    text-decoration: none;
}

.footer {
    margin: 15px 0;
    font-size: 10px;
    color: #666;
}

.hidden {
    display: none;
}

.favoriteForm {
    background: #181818;
    border: 1px solid #444;
    border-radius: 5px;
    padding: 8px;
    margin-top: 8px;
}
</style>
</head>

<body>

<div class="header">
    🌐 GOOGLE HUB
</div>

<div class="clock" id="clock">
    00:00
</div>

<div class="status">
    📱 Nokia 3210 4G • TA-1618
</div>

<div class="container">

    <!-- SEARCH -->

    <div class="section">
        🔎 SEARCH
    </div>

    <input
        id="searchBox"
        type="text"
        placeholder="Search Google..."
        onkeydown="searchKey(event)"
    >

    <button onclick="googleSearch()">
        🔍 Search Google
    </button>


    <!-- FAVORITES -->

    <div class="section">
        ⭐ FAVORITES
    </div>

    <button onclick="showFavorites()">
        ⭐ Go to Favorites
    </button>

    <button onclick="showFavoriteForm()">
        ➕ Add Favorite
    </button>

    <div id="favoriteForm" class="favoriteForm hidden">

        <input
            id="favoriteName"
            type="text"
            placeholder="Favorite name"
        >

        <input
            id="favoriteURL"
            type="text"
            placeholder="Website URL"
        >

        <button onclick="saveFavorite()">
            💾 Save Favorite
        </button>

        <button onclick="cancelFavorite()">
            ❌ Cancel
        </button>

    </div>


    <!-- BROWSER -->

    <div class="section">
        🌐 BROWSER
    </div>

    <input
        id="urlBox"
        type="text"
        placeholder="Enter website..."
        onkeydown="urlKey(event)"
    >

    <button onclick="openURL()">
        🚀 Go
    </button>


    <!-- GOOGLE -->

    <div class="section">
        🔵 GOOGLE
    </div>

    <button onclick="openSite('https://www.google.com/search')">
        🔍 Google Search
    </button>

    <button onclick="openSite('https://images.google.com')">
        🖼️ Google Images
    </button>

    <button onclick="openSite('https://news.google.com')">
        📰 Google News
    </button>

    <button onclick="openSite('https://translate.google.com')">
        🌐 Google Translate
    </button>

    <button onclick="openSite('https://www.google.com/search?q=weather')">
        🌤️ Google Weather
    </button>


    <!-- OTHER -->

    <div class="section">
        🌍 OTHER
    </div>

    <button onclick="openSite('https://www.wikipedia.org')">
        📚 Wikipedia
    </button>


    <!-- HISTORY -->

    <div class="section">
        🕘 HISTORY
    </div>

    <button onclick="showHistory()">
        🕘 View History
    </button>

    <button onclick="clearHistory()">
        🗑️ Clear History
    </button>


    <!-- CONTROLS -->

    <div class="section">
        ⚙️ CONTROLS
    </div>

    <button onclick="refreshPage()">
        🔄 Refresh
    </button>

    <button onclick="goBack()">
        ◀️ Back
    </button>


    <!-- FAVORITES PANEL -->

    <div id="favoritesPanel" class="hidden">

        <div class="section">
            ⭐ SAVED FAVORITES
        </div>

        <div id="favoritesList"></div>

        <button onclick="hidePanels()">
            ◀ Back
        </button>

    </div>


    <!-- HISTORY PANEL -->

    <div id="historyPanel" class="hidden">

        <div class="section">
            🕘 BROWSING HISTORY
        </div>

        <div id="historyList"></div>

        <button onclick="hidePanels()">
            ◀ Back
        </button>

    </div>

</div>

<div class="footer">
    ⭐ Google Hub v5
</div>


<script>

/* CLOCK */

function updateClock() {

    var now = new Date();

    var h = String(now.getHours()).padStart(2, "0");
    var m = String(now.getMinutes()).padStart(2, "0");

    document.getElementById("clock").innerHTML =
        h + ":" + m;
}

setInterval(updateClock, 1000);
updateClock();


/* OPEN SITE */

function openSite(url) {

    window.location.href = url;
}


/* GOOGLE SEARCH */

function googleSearch() {

    var query =
        document.getElementById("searchBox").value.trim();

    if (!query) {
        return;
    }

    var url =
        "https://www.google.com/search?q=" +
        encodeURIComponent(query);

    window.location.href = url;
}


function searchKey(event) {

    if (event.key === "Enter") {
        googleSearch();
    }
}


/* BROWSER */

function openURL() {

    var url =
        document.getElementById("urlBox").value.trim();

    if (!url) {
        return;
    }

    if (
        !url.startsWith("http://") &&
        !url.startsWith("https://")
    ) {
        url = "https://" + url;
    }

    window.location.href = url;
}


function urlKey(event) {

    if (event.key === "Enter") {
        openURL();
    }
}


/* FAVORITE FORM */

function showFavoriteForm() {

    hidePanels();

    document.getElementById(
        "favoriteForm"
    ).classList.remove("hidden");

    document.getElementById(
        "favoriteName"
    ).focus();
}


function cancelFavorite() {

    document.getElementById(
        "favoriteForm"
    ).classList.add("hidden");
}


/* FAVORITES STORAGE */

function getFavorites() {

    try {

        var data =
            localStorage.getItem("googleHubFavorites");

        if (!data) {
            return [];
        }

        return JSON.parse(data);

    } catch (e) {

        return [];
    }
}


function saveFavoriteData(list) {

    try {

        localStorage.setItem(
            "googleHubFavorites",
            JSON.stringify(list)
        );

        return true;

    } catch (e) {

        return false;
    }
}


/* SAVE FAVORITE */

function saveFavorite() {

    var name =
        document.getElementById(
            "favoriteName"
        ).value.trim();

    var url =
        document.getElementById(
            "favoriteURL"
        ).value.trim();

    if (!name || !url) {
        return;
    }

    if (
        !url.startsWith("http://") &&
        !url.startsWith("https://")
    ) {
        url = "https://" + url;
    }

    var list = getFavorites();

    list.push({
        name: name,
        url: url
    });

    if (!saveFavoriteData(list)) {
        return;
    }

    document.getElementById(
        "favoriteName"
    ).value = "";

    document.getElementById(
        "favoriteURL"
    ).value = "";

    document.getElementById(
        "favoriteForm"
    ).classList.add("hidden");

    showFavorites();
}


/* SHOW FAVORITES */

function showFavorites() {

    hidePanels();

    document.getElementById(
        "favoritesPanel"
    ).classList.remove("hidden");

    var list = getFavorites();

    var html = "";

    if (list.length === 0) {

        html =
            '<div class="item">⭐ No favorites yet.</div>';

    } else {

        for (var i = 0; i < list.length; i++) {

            html +=
                '<div class="item">' +
                '⭐ <a href="' +
                list[i].url +
                '">' +
                list[i].name +
                '</a>' +
                '</div>';
        }
    }

    document.getElementById(
        "favoritesList"
    ).innerHTML = html;
}


/* HISTORY */

function getHistory() {

    try {

        var data =
            localStorage.getItem("googleHubHistory");

        if (!data) {
            return [];
        }

        return JSON.parse(data);

    } catch (e) {

        return [];
    }
}


function saveHistory(url) {

    try {

        var list = getHistory();

        list.unshift(url);

        if (list.length > 20) {
            list = list.slice(0, 20);
        }

        localStorage.setItem(
            "googleHubHistory",
            JSON.stringify(list)
        );

    } catch (e) {
        /* Ignore storage errors */
    }
}


function showHistory() {

    hidePanels();

    document.getElementById(
        "historyPanel"
    ).classList.remove("hidden");

    var list = getHistory();

    var html = "";

    if (list.length === 0) {

        html =
            '<div class="item">🕘 History is empty.</div>';

    } else {

        for (var i = 0; i < list.length; i++) {

            html +=
                '<div class="item">' +
                '🕘 <a href="' +
                list[i] +
                '">' +
                list[i] +
                '</a>' +
                '</div>';
        }
    }

    document.getElementById(
        "historyList"
    ).innerHTML = html;
}


function clearHistory() {

    try {
        localStorage.removeItem(
            "googleHubHistory"
        );
    } catch (e) {}

    showHistory();
}


/* PANELS */

function hidePanels() {

    document.getElementById(
        "favoritesPanel"
    ).classList.add("hidden");

    document.getElementById(
        "historyPanel"
    ).classList.add("hidden");
}


/* CONTROLS */

function refreshPage() {
    location.reload();
}


function goBack() {

    if (history.length > 1) {

        history.back();

    } else {

        window.location.href =
            "https://artinxray.github.io/nokia3210-google/";
    }
}

</script>

</body>
</html>
