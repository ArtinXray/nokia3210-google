<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>Nokia Browser</title>

<style>
* { box-sizing: border-box; }

:root {
    --bg: #080808;
    --text: #ffffff;
    --panel: #171717;
    --border: #333333;
    --input: #111111;
    --muted: #aaaaaa;
    --accent: #4285f4;
}

body.light {
    --bg: #f5f5f5;
    --text: #171717;
    --panel: #ffffff;
    --border: #dddddd;
    --input: #ffffff;
    --muted: #666666;
}

body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, sans-serif;
    min-height: 100vh;
    transition: background .2s, color .2s;
}

button, input { font-family: Arial, sans-serif; }
button { cursor: pointer; }

.topbar {
    width: 100%;
    height: 55px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
}

.icon-button {
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 25px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
}

.icon-button:active { background: var(--border); }
.menu-wrap { position: relative; }

.menu {
    display: none;
    position: absolute;
    top: 43px;
    right: 0;
    width: 155px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    z-index: 10;
    box-shadow: 0 5px 15px rgba(0,0,0,.25);
}

.menu.show { display: block; }

.menu button {
    display: block;
    width: 100%;
    padding: 13px 14px;
    text-align: left;
    color: var(--text);
    background: transparent;
    border: none;
    font-size: 14px;
}

.menu button:active { background: var(--border); }

main {
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    padding: 35px 18px 20px;
    text-align: center;
}

.logo {
    font-size: 39px;
    font-weight: bold;
    letter-spacing: -1.5px;
    margin: 15px 0 25px;
    white-space: nowrap;
}

.clock {
    font-size: 17px;
    color: var(--muted);
    margin-bottom: 25px;
}

.search-box {
    width: 100%;
    display: flex;
    align-items: center;
    border: 1px solid var(--border);
    border-radius: 25px;
    background: var(--input);
    padding: 4px 8px 4px 15px;
}

.search-box:focus-within { border-color: var(--accent); }

#searchInput {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 16px;
    padding: 11px 0;
}

.search-box button {
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 20px;
    padding: 5px 7px;
}

.actions {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 18px;
}

.action-button {
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    background: var(--panel);
    font-size: 13px;
}

.action-button:active { opacity: .7; }

#notice {
    font-size: 12px;
    color: var(--muted);
    margin-top: 12px;
    min-height: 15px;
}

.panel {
    display: none;
    max-width: 520px;
    margin: 10px auto 30px;
    padding: 0 18px;
}

.panel.show { display: block; }

.panel-inner {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 15px;
}

.panel-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 12px;
}

.panel-heading h2 { font-size: 18px; margin: 0; }

.small-button {
    border: 1px solid var(--border);
    border-radius: 7px;
    background: transparent;
    color: var(--text);
    padding: 7px 9px;
    font-size: 12px;
}

.list-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 0;
    border-top: 1px solid var(--border);
}

.item-open {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
    text-align: left;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 14px;
    padding: 4px 0;
}

.remove-button {
    flex-shrink: 0;
    border: none;
    background: transparent;
    color: #e45b5b;
    font-size: 19px;
    padding: 4px 7px;
}

.empty {
    color: var(--muted);
    font-size: 13px;
    padding: 15px 0 5px;
}

footer {
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 1.5px;
    padding: 25px 10px;
}

@media (max-width: 360px) {
    .logo { font-size: 34px; }
    .action-button { font-size: 12px; padding: 9px 8px; }
}

@media (max-height: 600px) {
    main { padding-top: 10px; }
    .logo { margin: 8px 0 15px; }
    .clock { margin-bottom: 15px; }
}
</style>
</head>

<body>

<header class="topbar">
    <button id="themeButton" class="icon-button"
        aria-label="Change theme" title="Change theme">🌙</button>

    <div class="menu-wrap">
        <button id="moreButton" class="icon-button"
            aria-label="More options" title="More">⋮</button>

        <div id="moreMenu" class="menu">
            <button id="openHistory">History</button>
            <button id="openFavorites">Favorites</button>
        </div>
    </div>
</header>

<main>
    <div class="logo" aria-label="Nokia Browser">
        <span style="color:#4285F4">Nokia</span>
        <span style="color:#EA4335">Browser</span>
    </div>

    <div id="clock" class="clock">--:--</div>

    <form id="searchForm">
        <div class="search-box">
            <input id="searchInput" type="text"
                placeholder="Search Google or enter URL"
                autocomplete="off">
            <button type="submit" aria-label="Search">⌕</button>
        </div>
    </form>

    <div class="actions">
        <button id="searchButton" class="action-button">Google Search</button>
        <button id="favoriteButton" class="action-button">☆ Favorite</button>
    </div>

    <div id="notice"></div>
</main>

<section id="historyPanel" class="panel">
    <div class="panel-inner">
        <div class="panel-heading">
            <h2>History</h2>
            <div>
                <button id="clearHistory" class="small-button">Clear All</button>
                <button class="small-button closePanel">Close</button>
            </div>
        </div>
        <div id="historyList"></div>
    </div>
</section>

<section id="favoritesPanel" class="panel">
    <div class="panel-inner">
        <div class="panel-heading">
            <h2>Favorites</h2>
            <button class="small-button closePanel">Close</button>
        </div>
        <div id="favoritesList"></div>
    </div>
</section>

<footer>NOKIA BROWSER • NOKIA 3210 4G</footer>

<script>
(function () {
    var input = document.getElementById("searchInput");
    var notice = document.getElementById("notice");
    var historyPanel = document.getElementById("historyPanel");
    var favoritesPanel = document.getElementById("favoritesPanel");
    var moreMenu = document.getElementById("moreMenu");
    var themeButton = document.getElementById("themeButton");

    function loadData(key) {
        try {
            var value = localStorage.getItem(key);
            return value ? JSON.parse(value) : [];
        } catch (e) {
            return [];
        }
    }

    function saveData(key, data) {
        try {
            localStorage.setItem(key, JSON.stringify(data));
        } catch (e) {}
    }

    var history = loadData("nokia_history");
    var favorites = loadData("nokia_favorites");

    if (!Array.isArray(history)) history = [];
    if (!Array.isArray(favorites)) favorites = [];

    history = history.filter(function (item) {
        return typeof item === "string";
    });

    favorites = favorites.filter(function (item) {
        return item && typeof item.text === "string"
            && typeof item.url === "string";
    });

    function updateClock() {
        var now = new Date();
        var h = String(now.getHours()).padStart(2, "0");
        var m = String(now.getMinutes()).padStart(2, "0");
        document.getElementById("clock").textContent = h + ":" + m;
    }

    updateClock();
    setInterval(updateClock, 1000);

    function setTheme(isLight) {
        if (isLight) {
            document.body.classList.add("light");
            themeButton.textContent = "☀️";
            themeButton.title = "Light mode";
            document.querySelector('meta[name="theme-color"]')
                .setAttribute("content", "#f5f5f5");
            try { localStorage.setItem("nokia_lite", "true"); } catch (e) {}
        } else {
            document.body.classList.remove("light");
            themeButton.textContent = "🌙";
            themeButton.title = "Dark mode";
            document.querySelector('meta[name="theme-color"]')
                .setAttribute("content", "#080808");
            try { localStorage.setItem("nokia_lite", "false"); } catch (e) {}
        }
    }

    var savedTheme = "false";
    try {
        savedTheme = localStorage.getItem("nokia_lite") || "false";
    } catch (e) {}

    setTheme(savedTheme === "true");

    themeButton.addEventListener("click", function () {
        setTheme(!document.body.classList.contains("light"));
    });

    function closePanels() {
        historyPanel.classList.remove("show");
        favoritesPanel.classList.remove("show");
    }

    document.getElementById("moreButton").addEventListener("click", function (e) {
        e.stopPropagation();
        moreMenu.classList.toggle("show");
    });

    document.addEventListener("click", function (e) {
        if (!e.target.closest(".menu-wrap")) {
            moreMenu.classList.remove("show");
        }
    });

    document.getElementById("openHistory").addEventListener("click", function () {
        moreMenu.classList.remove("show");
        favoritesPanel.classList.remove("show");
        historyPanel.classList.add("show");
        renderHistory();
    });

    document.getElementById("openFavorites").addEventListener("click", function () {
        moreMenu.classList.remove("show");
        historyPanel.classList.remove("show");
        favoritesPanel.classList.add("show");
        renderFavorites();
    });

    document.querySelectorAll(".closePanel").forEach(function (button) {
        button.addEventListener("click", closePanels);
    });

    function getTarget(value) {
        value = value.trim();

        if (/^https?:\/\//i.test(value)) return value;

        if (/^(www\.)/i.test(value) ||
            /^[\w-]+(\.[\w-]+)+([/:?#].*)?$/i.test(value)) {
            return "https://" + value;
        }

        return "https://www.google.com/search?q=" +
            encodeURIComponent(value);
    }

    function addToHistory(value) {
        history = history.filter(function (item) {
            return item !== value;
        });

        history.unshift(value);
        history = history.slice(0, 5);
        saveData("nokia_history", history);
        renderHistory();
    }

    function openValue(value) {
        value = String(value || "").trim();
        if (!value) return;

        addToHistory(value);
        window.location.href = getTarget(value);
    }

    document.getElementById("searchForm").addEventListener("submit", function (e) {
        e.preventDefault();
        openValue(input.value);
    });

    document.getElementById("searchButton").addEventListener("click", function () {
        openValue(input.value);
    });

    document.getElementById("favoriteButton").addEventListener("click", function () {
        var value = input.value.trim();

        if (!value) {
            notice.textContent = "Enter a search or URL first.";
            return;
        }

        var item = { text: value, url: getTarget(value) };

        var exists = favorites.some(function (fav) {
            return fav.text === item.text;
        });

        if (exists) {
            notice.textContent = "Already in Favorites.";
            return;
        }

        favorites.unshift(item);
        favorites = favorites.slice(0, 5);
        saveData("nokia_favorites", favorites);
        renderFavorites();
        notice.textContent = "Added to Favorites!";
    });

    function renderHistory() {
        var list = document.getElementById("historyList");
        list.innerHTML = "";

        if (!history.length) {
            list.innerHTML = '<div class="empty">No history yet.</div>';
            return;
        }

        history.forEach(function (value, index) {
            var row = document.createElement("div");
            row.className = "list-item";

            var open = document.createElement("button");
            open.className = "item-open";
            open.textContent = value;
            open.title = value;
            open.addEventListener("click", function () {
                openValue(value);
            });

            var remove = document.createElement("button");
            remove.className = "remove-button";
            remove.textContent = "×";
            remove.title = "Delete this history item";
            remove.setAttribute("aria-label", "Delete history item");
            remove.addEventListener("click", function () {
                history.splice(index, 1);
                saveData("nokia_history", history);
                renderHistory();
            });

            row.appendChild(open);
            row.appendChild(remove);
            list.appendChild(row);
        });
    }

    function renderFavorites() {
        var list = document.getElementById("favoritesList");
        list.innerHTML = "";

        if (!favorites.length) {
            list.innerHTML = '<div class="empty">No favorites yet.</div>';
            return;
        }

        favorites.forEach(function (item, index) {
            var row = document.createElement("div");
            row.className = "list-item";

            var open = document.createElement("button");
            open.className = "item-open";
            open.textContent = item.text;
            open.title = item.text;
            open.addEventListener("click", function () {
                openValue(item.text);
            });

            var remove = document.createElement("button");
            remove.className = "remove-button";
            remove.textContent = "×";
            remove.title = "Remove this favorite";
            remove.setAttribute("aria-label", "Remove favorite");
            remove.addEventListener("click", function () {
                favorites.splice(index, 1);
                saveData("nokia_favorites", favorites);
                renderFavorites();
            });

            row.appendChild(open);
            row.appendChild(remove);
            list.appendChild(row);
        });
    }

    document.getElementById("clearHistory").addEventListener("click", function () {
        history = [];
        saveData("nokia_history", history);
        renderHistory();
        notice.textContent = "History cleared.";
    });

    renderHistory();
    renderFavorites();
})();
</script>

</body>
</html>
