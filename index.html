<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nokia Browser</title>
<style>
body{
  margin:0;
  padding:20px 10px;
  font-family:Arial,sans-serif;
  background:#fff;
  text-align:center;
}
h2{color:#4285f4}
input{
  width:90%;
  box-sizing:border-box;
  padding:12px 8px;
  border:1px solid #ccc;
  border-radius:20px;
  font-size:16px;
}
button{
  margin-top:12px;
  padding:10px 25px;
  border:0;
  border-radius:20px;
  background:#4285f4;
  color:white;
  font-size:15px;
}
</style>
</head>
<body>
<h2>Nokia Browser</h2>
<form action="https://www.google.com/search" method="get">
<input name="q" type="text"
placeholder="Search Google..." required>
<br>
<button type="submit">Search</button>
</form>
</body>
</html>
