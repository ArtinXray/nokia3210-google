<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Google Hub</title>

<style>

body {
    margin: 0;
    padding: 0;
    background: #101010;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.header {
    background: #202020;
    padding: 10px;
    font-size: 19px;
    font-weight: bold;
    border-bottom: 1px solid #444;
}

.clock {
    padding: 5px;
    font-size: 13px;
    color: #ccc;
}

.status {
    font-size: 10px;
    color: #777;
}

.container {
    padding: 7px;
}

.section {
    margin-top: 12px;
    margin-bottom: 5px;
    text-align: left;
    color: #999;
    font-size: 11px;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 10px;
    margin: 5px 0;

    background: #181818;
    color: white;

    border: 1px solid #555;
    border-radius: 5px;

    font-size: 14px;
}

button {
    width: 100%;
    box-sizing: border-box;

    margin: 6px 0;
    padding: 10px;

    background: #202020;
    color: white;

    border: 1px solid #555;
    border-radius: 5px;

    font-size: 15px;
}

button:active {
    background: #444;
}

.panel {
    margin-top: 8px;
    padding: 7px;

    background: #151515;

    border: 1px solid #444;
    border-radius: 5px;
}

.item {
    margin: 5px 0;
    padding: 9px;

    background: #1c1c1c;

    border: 1px solid #444;
    border-radius: 5px;

    text-align: left;

    font-size: 13px;
}

.item a {
    color: white;
    text-decoration: none;
}

.message {
    padding: 10px;
    color: #aaa;
    font-size: 12px;
}

.hidden {
    display: none;
}

.footer {
    margin: 16px 0;
    color: #666;
    font-size: 10px;
}

</style>

</head>

<body>


<!-- HEADER -->

<div class="header">
    🌐 GOOGLE HUB
</div>

<div class="clock" id="clock">
    00:00
</div>

<div class="status">
    📱 Nokia 3210 4G • TA-1618
</div>


<div class="container">


<!-- SEARCH -->

<div class="section">
    🔎 SEARCH
</div>

<input
    id="searchBox"
    type="text"
    placeholder="Search Google..."
>

<button onclick="googleSearch()">
    🔍 Search Google
</button>


<!-- FAVORITES -->

<div class="section">
    ⭐ FAVORITES
</div>

<button onclick="showFavorites()">
    ⭐ Go to Favorites
</button>

<button onclick="showAddFavorite()">
    ➕ Add Favorite
</button>


<!-- ADD FAVORITE -->

<div
    id="addFavoritePanel"
    class="panel hidden"
>

    <div class="section">
        ⭐ NEW FAVORITE
    </div>

    <input
        id="favoriteName"
        type="text"
        placeholder="Favorite name"
    >

    <input
        id="favoriteURL"
        type="text"
        placeholder="Website URL"
    >

    <button onclick="saveFavorite()">
        💾 Save Favorite
    </button>

    <button onclick="closeAddFavorite()">
        ❌ Cancel
    </button>

</div>


<!-- FAVORITES -->

<div
    id="favoritesPanel"
    class="panel hidden"
>

    <div class="section">
        ⭐ SAVED FAVORITES
    </div>

    <div id="favoritesList">
    </div>

    <button onclick="closeFavorites()">
        ◀ Back
    </button>

</div>


<!-- BROWSER -->

<div class="section">
    🌐 BROWSER
</div>

<input
    id="urlBox"
    type="text"
    placeholder="Enter website..."
>

<button onclick="openBrowserURL()">
    🚀 Go
</button>


<!-- GOOGLE -->

<div class="section">
    🔵 GOOGLE
</div>

<button onclick="openSite('https://www.google.com')">
    🔍 Google Search
</button>

<button onclick="openSite('https://images.google.com')">
    🖼️ Google Images
</button>

<button onclick="openSite('https://news.google.com')">
    📰 Google News
</button>

<button onclick="openSite('https://translate.google.com')">
    🌐 Google Translate
</button>

<button onclick="openSite('https://www.google.com/search?q=weather')">
    🌤️ Google Weather
</button>


<!-- OTHER -->

<div class="section">
    🌍 OTHER
</div>

<button onclick="openSite('https://www.wikipedia.org')">
    📚 Wikipedia
</button>


<!-- HISTORY -->

<div class="section">
    🕘 HISTORY
</div>

<button onclick="showHistory()">
    🕘 View History
</button>

<button onclick="clearHistory()">
    🗑️ Clear History
</button>


<!-- HISTORY PANEL -->

<div
    id="historyPanel"
    class="panel hidden"
>

    <div class="section">
        🕘 BROWSING HISTORY
    </div>

    <div id="historyList">
    </div>

    <button onclick="closeHistory()">
        ◀ Back
    </button>

</div>


<!-- CONTROLS -->

<div class="section">
    ⚙️ CONTROLS
</div>

<button onclick="location.reload()">
    🔄 Refresh
</button>

<button onclick="goBack()">
    ◀️ Back
</button>


</div>


<div class="footer">
    ⭐ Google Hub v7
</div>



<script>


/* =========================================
   CLOCK
========================================= */

function updateClock() {

    var now = new Date();

    var h = now.getHours();
    var m = now.getMinutes();

    if (h < 10) {
        h = "0" + h;
    }

    if (m < 10) {
        m = "0" + m;
    }

    document.getElementById("clock").innerHTML =
        h + ":" + m;
}

updateClock();

setInterval(
    updateClock,
    1000
);



/* =========================================
   HIDE PANELS
========================================= */

function hidePanels() {

    document.getElementById(
        "addFavoritePanel"
    ).style.display = "none";

    document.getElementById(
        "favoritesPanel"
    ).style.display = "none";

    document.getElementById(
        "historyPanel"
    ).style.display = "none";
}



/* =========================================
   OPEN WEBSITE
========================================= */

function openSite(url) {

    saveHistory(url);

    window.location.href = url;
}



/* =========================================
   GOOGLE SEARCH
========================================= */

function googleSearch() {

    var text =
        document.getElementById(
            "searchBox"
        ).value;

    text =
        text.replace(
            /^\s+|\s+$/g,
            ""
        );

    if (text == "") {
        return;
    }

    var url =
        "https://www.google.com/search?q=" +
        encodeURIComponent(text);

    saveHistory(url);

    window.location.href = url;
}



/* =========================================
   BROWSER
========================================= */

function openBrowserURL() {

    var url =
        document.getElementById(
            "urlBox"
        ).value;

    url =
        url.replace(
            /^\s+|\s+$/g,
            ""
        );

    if (url == "") {
        return;
    }

    if (
        url.indexOf("http://") != 0 &&
        url.indexOf("https://") != 0
    ) {

        url =
            "https://" + url;
    }

    saveHistory(url);

    window.location.href = url;
}



/* =========================================
   FAVORITES
========================================= */


/*
   Get favorites
*/

function getFavorites() {

    try {

        var data =
            localStorage.getItem(
                "googleHubFavorites"
            );

        if (!data) {
            return [];
        }

        return JSON.parse(data);

    } catch (e) {

        return [];
    }
}


/*
   Save favorites
*/

function storeFavorites(list) {

    try {

        localStorage.setItem(
            "googleHubFavorites",
            JSON.stringify(list)
        );

        return true;

    } catch (e) {

        return false;
    }
}



/*
   Show Add Favorite
*/

function showAddFavorite() {

    hidePanels();

    document.getElementById(
        "addFavoritePanel"
    ).style.display = "block";

}



/*
   Close Add Favorite
*/

function closeAddFavorite() {

    document.getElementById(
        "addFavoritePanel"
    ).style.display = "none";

}



/*
   Save Favorite
*/

function saveFavorite() {

    var name =
        document.getElementById(
            "favoriteName"
        ).value;

    var url =
        document.getElementById(
            "favoriteURL"
        ).value;


    name =
        name.replace(
            /^\s+|\s+$/g,
            ""
        );

    url =
        url.replace(
            /^\s+|\s+$/g,
            ""
        );


    if (name == "") {
        return;
    }

    if (url == "") {
        return;
    }


    if (
        url.indexOf("http://") != 0 &&
        url.indexOf("https://") != 0
    ) {

        url =
            "https://" + url;
    }


    var list =
        getFavorites();


    list.push({

        name: name,

        url: url

    });


    if (
        storeFavorites(list)
    ) {

        document.getElementById(
            "favoriteName"
        ).value = "";

        document.getElementById(
            "favoriteURL"
        ).value = "";

        closeAddFavorite();

        showFavorites();

    } else {

        alert(
            "Cannot save favorites."
        );
    }
}



/*
   Show Favorites

   IMPORTANT:
   This function does NOT depend
   on any other button.
*/

function showFavorites() {

    hidePanels();

    document.getElementById(
        "favoritesPanel"
    ).style.display = "block";


    var list =
        getFavorites();


    var area =
        document.getElementById(
            "favoritesList"
        );


    area.innerHTML = "";


    if (
        list.length == 0
    ) {

        area.innerHTML =
            '<div class="message">' +
            '⭐ No favorites yet.' +
            '</div>';

        return;
    }


    var i;


    for (
        i = 0;
        i < list.length;
        i++
    ) {

        var item =
            document.createElement(
                "div"
            );

        item.className =
            "item";


        var link =
            document.createElement(
                "a"
            );

        link.href =
            list[i].url;

        link.innerHTML =
            "⭐ " +
            list[i].name;


        item.appendChild(
            link
        );


        area.appendChild(
            item
        );
    }
}



/*
   Close Favorites
*/

function closeFavorites() {

    document.getElementById(
        "favoritesPanel"
    ).style.display = "none";

}



/* =========================================
   HISTORY
========================================= */

function getHistory() {

    try {

        var data =
            localStorage.getItem(
                "googleHubHistory"
            );

        if (!data) {
            return [];
        }

        return JSON.parse(data);

    } catch (e) {

        return [];
    }
}


function saveHistory(url) {

    try {

        var list =
            getHistory();

        list.unshift(url);

        if (
            list.length > 20
        ) {

            list =
                list.slice(
                    0,
                    20
                );
        }

        localStorage.setItem(
            "googleHubHistory",
            JSON.stringify(list)
        );

    } catch (e) {

        /* Ignore */
    }
}



/*
   Show History
*/

function showHistory() {

    hidePanels();

    document.getElementById(
        "historyPanel"
    ).style.display = "block";


    var list =
        getHistory();


    var area =
        document.getElementById(
            "historyList"
        );


    area.innerHTML = "";


    if (
        list.length == 0
    ) {

        area.innerHTML =
            '<div class="message">' +
            '🕘 History is empty.' +
            '</div>';

        return;
    }


    var i;


    for (
        i = 0;
        i < list.length;
        i++
    ) {

        var item =
            document.createElement(
                "div"
            );

        item.className =
            "item";


        var link =
            document.createElement(
                "a"
            );

        link.href =
            list[i];

        link.innerHTML =
            "🕘 " +
            list[i];


        item.appendChild(
            link
        );


        area.appendChild(
            item
        );
    }
}



/*
   Clear History
*/

function clearHistory() {

    try {

        localStorage.removeItem(
            "googleHubHistory"
        );

    } catch (e) {}


    showHistory();
}



/*
   Close History
*/

function closeHistory() {

    document.getElementById(
        "historyPanel"
    ).style.display = "none";

}



/* =========================================
   BACK
========================================= */

function goBack() {

    if (
        window.history.length > 1
    ) {

        window.history.back();

    } else {

        window.location.href =
            "https://artinxray.github.io/nokia3210-google/";
    }
}


</script>

</body>
    </html>
