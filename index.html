<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ArtinGo</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    text-align: center;
}

.nokia-header {
    width: 100%;
    height: 58px;
    padding: 5px 10px;
}

.lite-button {
    width: 100%;
    height: 48px;
    margin: 0;
    padding: 0;
    border: 1px solid #fff;
    border-radius: 24px;
    background: #111;
    color: #fff;
    font-size: 14px;
    font-weight: normal;
}

.lite-button:active {
    background: #222;
}

.lite-button.on {
    background: #222;
    border-color: #fff;
}

.main {
    width: 100%;
    padding: 22px 12px 18px;
}

/* ArG Logo */
.logo {
    width: 160px;
    height: 100px;
    margin: 0 auto 25px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.logo svg {
    width: 100%;
    height: 100%;
    overflow: visible;
}

.search-box {
    width: 100%;
    height: 48px;
    border: 1px solid #555;
    border-radius: 24px;
    background: #181818;
    display: flex;
    align-items: center;
    padding: 0 10px;
}

#search {
    width: 100%;
    height: 42px;
    min-width: 0;
    border: none;
    outline: none;
    font-size: 16px;
    background: transparent;
    color: #fff;
    order: 1;
}

#search::placeholder {
    color: #888;
}

.search-button {
    width: 34px;
    height: 34px;
    flex-shrink: 0;
    border: none;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    margin-left: 5px;
    order: 2;
}

.search-button svg {
    width: 21px;
    height: 21px;
    fill: none;
    stroke: #aaa;
    stroke-width: 2.5;
}

.search-button:active svg {
    stroke: #fff;
}

#clock {
    font-size: 20px;
    margin-top: 15px;
    color: #fff;
}

.status {
    margin-top: 8px;
    font-size: 10px;
    color: #555;
    letter-spacing: 1px;
}

.section {
    margin-top: 18px;
    border-top: 1px solid #222;
    padding-top: 12px;
}

.section-title {
    font-size: 12px;
    color: #888;
    letter-spacing: 1px;
    margin-bottom: 8px;
}

.item {
    width: 100%;
    min-height: 38px;
    margin: 5px 0;
    border: 1px solid #292929;
    border-radius: 7px;
    background: #0d0d0d;
    color: #ccc;
    font-size: 13px;
    text-align: left;
    padding: 9px 10px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.item:active {
    background: #202020;
}

.add-favorite {
    width: 100%;
    height: 40px;
    margin-top: 7px;
    border: 1px solid #292929;
    border-radius: 7px;
    background: #111;
    color: #aaa;
    font-size: 12px;
}

.add-favorite:active {
    background: #222;
}

.clear {
    margin-top: 7px;
    color: #666;
    font-size: 10px;
    cursor: pointer;
}

body.lite-mode .section,
body.lite-mode .status {
    display: none;
}

body.lite-mode .main {
    padding-top: 30px;
}

.footer {
    margin-top: 20px;
    color: #333;
    font-size: 9px;
    letter-spacing: 1px;
}
</style>
</head>

<body>

<div class="nokia-header">
    <button id="liteButton"
            class="lite-button"
            onclick="toggleLite()">
        ⚡ Lite Mode: OFF
    </button>
</div>

<div class="main">

    <!-- Custom ArG Logo -->
    <div class="logo">
        <svg viewBox="0 0 200 125"
             xmlns="http://www.w3.org/2000/svg"
             role="img"
             aria-label="ArG Logo">

            <defs>
                <linearGradient id="aBlue" x1="0" y1="0" x2="0.8" y2="1">
                    <stop offset="0%" stop-color="#78D7FF"/>
                    <stop offset="45%" stop-color="#168BFF"/>
                    <stop offset="100%" stop-color="#0648CF"/>
                </linearGradient>

                <linearGradient id="rGold" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#FFF58A"/>
                    <stop offset="50%" stop-color="#FFC928"/>
                    <stop offset="100%" stop-color="#F28B00"/>
                </linearGradient>

                <linearGradient id="gColor" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#FF6259"/>
                    <stop offset="35%" stop-color="#F52D38"/>
                    <stop offset="65%" stop-color="#F7C82C"/>
                    <stop offset="100%" stop-color="#24C878"/>
                </linearGradient>

                <linearGradient id="ringColor" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#087BFF"/>
                    <stop offset="30%" stop-color="#20C978"/>
                    <stop offset="62%" stop-color="#FFD12D"/>
                    <stop offset="82%" stop-color="#FF483E"/>
                    <stop offset="100%" stop-color="#FFB52D"/>
                </linearGradient>
            </defs>

            <!-- Back part of the orbital ring -->
            <path d="M 27,43 C 55,4 143,2 175,38"
                  fill="none"
                  stroke="url(#ringColor)"
                  stroke-width="6"
                  stroke-linecap="round"/>

            <!-- ArG lettering -->
            <text x="17" y="79"
                  font-family="Arial,sans-serif"
                  font-size="68"
                  font-weight="bold"
                  fill="url(#aBlue)">A</text>

            <text x="78" y="79"
                  font-family="Arial,sans-serif"
                  font-size="61"
                  font-weight="bold"
                  fill="url(#rGold)">r</text>

            <text x="111" y="79"
                  font-family="Arial,sans-serif"
                  font-size="68"
                  font-weight="bold"
                  fill="url(#gColor)">G</text>

            <!-- Front part of the orbital ring -->
            <path d="M 177,47 C 162,94 72,116 24,87"
                  fill="none"
                  stroke="url(#ringColor)"
                  stroke-width="6"
                  stroke-linecap="round"/>
        </svg>
    </div>

    <!-- Search -->
    <div class="search-box">
        <input id="search"
               type="text"
               placeholder="Search or enter website"
               onkeydown="searchKey(event)">

        <button class="search-button"
                onclick="openSearch()"
                aria-label="Search">
            <svg viewBox="0 0 24 24">
                <circle cx="10.5" cy="10.5" r="6.5"></circle>
                <line x1="16" y1="16" x2="21" y2="21"></line>
            </svg>
        </button>
    </div>

    <!-- Clock -->
    <div id="clock">00:00:00</div>
    <div class="status">ARTINGO MINI BROWSER</div>

    <!-- History -->
    <div class="section">
        <div class="section-title">HISTORY</div>
        <div id="history"></div>
        <div class="clear" onclick="clearHistory()">Clear History</div>
    </div>

    <!-- Favorites -->
    <div class="section">
        <div class="section-title">FAVORITES</div>
        <div id="favorites"></div>

        <button class="add-favorite" onclick="addFavorite()">
            + Add current address to Favorites
        </button>

        <div class="clear" onclick="clearFavorites()">Clear Favorites</div>
    </div>

    <div class="footer">ARTINGO • NOKIA 3210 4G</div>
</div>

<script>
var historyList = [];
var favorites = [];
var liteMode = false;

/* Load saved data */
try {
    historyList = JSON.parse(
        localStorage.getItem("nokia_history") || "[]"
    );
    if (!Array.isArray(historyList)) historyList = [];
} catch (e) {
    historyList = [];
}

try {
    favorites = JSON.parse(
        localStorage.getItem("nokia_favorites") || "[]"
    );
    if (!Array.isArray(favorites)) favorites = [];
} catch (e) {
    favorites = [];
}

try {
    liteMode = localStorage.getItem("nokia_lite") === "true";
} catch (e) {
    liteMode = false;
}

/* Search */
function openSearch() {
    var input = document.getElementById("search");
    var text = input.value.replace(/^\s+|\s+$/g, "");

    if (!text) return;

    addHistory(text);

    var isWebsite =
        text.indexOf("://") > 0 ||
        text.indexOf(".") > 0;

    if (isWebsite) {
        var url = text;

        if (url.indexOf("://") === -1) {
            url = "https://" + url;
        }

        window.location.href = url;
    } else {
        window.location.href =
            "https://www.google.com/search?q=" +
            encodeURIComponent(text);
    }
}

function searchKey(event) {
    if (event.keyCode === 13 || event.which === 13) {
        openSearch();
    }
}

/* History */
function addHistory(text) {
    var newList = [text];

    for (var i = 0; i < historyList.length; i++) {
        if (historyList[i] !== text) {
            newList.push(historyList[i]);
        }
    }

    historyList = newList.slice(0, 5);

    try {
        localStorage.setItem(
            "nokia_history",
            JSON.stringify(historyList)
        );
    } catch (e) {}

    showHistory();
}

function showHistory() {
    var box = document.getElementById("history");
    box.innerHTML = "";

    if (!historyList.length) {
        var empty = document.createElement("div");
        empty.style.color = "#444";
        empty.style.fontSize = "11px";
        empty.textContent = "No history";
        box.appendChild(empty);
        return;
    }

    for (var i = 0; i < historyList.length; i++) {
        createItem(historyList[i], box, false);
    }
}

function clearHistory() {
    historyList = [];

    try {
        localStorage.removeItem("nokia_history");
    } catch (e) {}

    showHistory();
}

/* Favorites */
function addFavorite() {
    var text = document.getElementById("search")
        .value.replace(/^\s+|\s+$/g, "");

    if (!text || favorites.indexOf(text) !== -1) return;

    favorites.push(text);
    favorites = favorites.slice(0, 5);

    try {
        localStorage.setItem(
            "nokia_favorites",
            JSON.stringify(favorites)
        );
    } catch (e) {}

    showFavorites();
}

function showFavorites() {
    var box = document.getElementById("favorites");
    box.innerHTML = "";

    if (!favorites.length) {
        var empty = document.createElement("div");
        empty.style.color = "#444";
        empty.style.fontSize = "11px";
        empty.textContent = "No favorites";
        box.appendChild(empty);
        return;
    }

    for (var i = 0; i < favorites.length; i++) {
        createItem(favorites[i], box, true);
    }
}

function clearFavorites() {
    favorites = [];

    try {
        localStorage.removeItem("nokia_favorites");
    } catch (e) {}

    showFavorites();
}

function createItem(text, box, isFavorite) {
    var item = document.createElement("div");
    item.className = "item";
    item.textContent = (isFavorite ? "⭐ " : "") + text;

    item.onclick = function() {
        document.getElementById("search").value = text;
        openSearch();
    };

    box.appendChild(item);
}

/* Lite Mode */
function applyLite() {
    var button = document.getElementById("liteButton");

    if (liteMode) {
        document.body.className = "lite-mode";
        button.className = "lite-button on";
        button.textContent = "⚡ Lite Mode: ON";
    } else {
        document.body.className = "";
        button.className = "lite-button";
        button.textContent = "⚡ Lite Mode: OFF";
    }
}

function toggleLite() {
    liteMode = !liteMode;

    try {
        localStorage.setItem("nokia_lite", String(liteMode));
    } catch (e) {}

    applyLite();
}

/* Clock */
function updateClock() {
    var now = new Date();

    var h = String(now.getHours()).padStart(2, "0");
    var m = String(now.getMinutes()).padStart(2, "0");
    var s = String(now.getSeconds()).padStart(2, "0");

    document.getElementById("clock").textContent =
        h + ":" + m + ":" + s;
}

/* Start */
updateClock();
setInterval(updateClock, 1000);
showHistory();
showFavorites();
applyLite();
</script>

</body>
</html>
