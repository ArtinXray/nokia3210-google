<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Google Hub</title>

<style>

body {
    margin: 0;
    padding: 0;
    background: #101010;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.header {
    background: #202020;
    padding: 10px;
    font-size: 19px;
    font-weight: bold;
    border-bottom: 1px solid #444;
}

.clock {
    padding: 5px;
    font-size: 14px;
    color: #ddd;
}

.status {
    font-size: 10px;
    color: #777;
}

.container {
    padding: 7px;
}

.section {
    margin-top: 12px;
    margin-bottom: 5px;
    text-align: left;
    color: #999;
    font-size: 11px;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 10px;
    margin: 5px 0;

    background: #181818;
    color: white;

    border: 1px solid #555;
    border-radius: 5px;

    font-size: 14px;
}

button {
    width: 100%;
    box-sizing: border-box;

    margin: 6px 0;
    padding: 10px;

    background: #202020;
    color: white;

    border: 1px solid #555;
    border-radius: 5px;

    font-size: 15px;
}

button:active {
    background: #444;
}

.panel {
    margin-top: 8px;
    padding: 7px;

    background: #151515;

    border: 1px solid #444;
    border-radius: 5px;
}

.item {
    margin: 5px 0;
    padding: 9px;

    background: #1c1c1c;

    border: 1px solid #444;
    border-radius: 5px;

    text-align: left;

    font-size: 13px;
}

.item a {
    color: white;
    text-decoration: none;
}

.delete {
    float: right;
    width: auto;
    margin: 0;
    padding: 3px 7px;
    font-size: 11px;
}

.message {
    padding: 10px;
    color: #aaa;
    font-size: 12px;
}

.hidden {
    display: none;
}

.footer {
    margin: 16px 0;
    color: #666;
    font-size: 10px;
}

</style>

</head>


<body>


<div class="header">
    🌐 GOOGLE HUB
</div>


<div id="clock" class="clock">
    --:--
</div>


<div class="status">
    📱 Nokia 3210 4G • TA-1618
</div>


<div class="container">


<!-- =========================
     SEARCH
========================= -->

<div class="section">
    🔎 SEARCH
</div>

<input
    id="searchBox"
    type="text"
    placeholder="Search Google..."
>

<button onclick="searchGoogle()">
    🔍 Search Google
</button>


<!-- =========================
     FAVORITES
========================= -->

<div class="section">
    ⭐ FAVORITES
</div>

<button onclick="openFavorites()">
    ⭐ Go to Favorites
</button>

<button onclick="newFavorite()">
    ➕ Add Favorite
</button>


<!-- ADD FAVORITE -->

<div
    id="favoriteForm"
    class="panel hidden"
>

<div class="section">
    ⭐ NEW FAVORITE
</div>

<input
    id="favoriteName"
    type="text"
    placeholder="Favorite name"
>

<input
    id="favoriteURL"
    type="text"
    placeholder="Website URL"
>

<button onclick="saveFavorite()">
    💾 Save Favorite
</button>

<button onclick="cancelFavorite()">
    ❌ Cancel
</button>

</div>


<!-- FAVORITES LIST -->

<div
    id="favoritesPanel"
    class="panel hidden"
>

<div class="section">
    ⭐ SAVED FAVORITES
</div>

<div id="favoritesList"></div>

<button onclick="closeFavorites()">
    ◀ Back
</button>

</div>


<!-- =========================
     BROWSER
========================= -->

<div class="section">
    🌐 BROWSER
</div>

<input
    id="urlBox"
    type="text"
    placeholder="Enter website..."
>

<button onclick="goWebsite()">
    🚀 Go
</button>


<!-- =========================
     GOOGLE
========================= -->

<div class="section">
    🔵 GOOGLE
</div>

<button onclick="go('https://www.google.com')">
    🔍 Google Search
</button>

<button onclick="go('https://images.google.com')">
    🖼️ Google Images
</button>

<button onclick="go('https://news.google.com')">
    📰 Google News
</button>

<button onclick="go('https://translate.google.com')">
    🌐 Google Translate
</button>

<button onclick="go('https://www.google.com/search?q=weather')">
    🌤️ Google Weather
</button>


<!-- =========================
     OTHER
========================= -->

<div class="section">
    🌍 OTHER
</div>

<button onclick="go('https://www.wikipedia.org')">
    📚 Wikipedia
</button>


<!-- =========================
     HISTORY
========================= -->

<div class="section">
    🕘 HISTORY
</div>

<button onclick="openHistory()">
    🕘 View History
</button>

<button onclick="clearHistory()">
    🗑️ Clear History
</button>


<div
    id="historyPanel"
    class="panel hidden"
>

<div class="section">
    🕘 BROWSING HISTORY
</div>

<div id="historyList"></div>

<button onclick="closeHistory()">
    ◀ Back
</button>

</div>


<!-- =========================
     CONTROLS
========================= -->

<div class="section">
    ⚙️ CONTROLS
</div>

<button onclick="location.reload()">
    🔄 Refresh
</button>

<button onclick="goBack()">
    ◀️ Back
</button>


</div>


<div class="footer">
    ⭐ Google Hub v8
</div>


<script>


/* =====================================
   FAVORITES
   Memory only - no localStorage
===================================== */

var favorites = [];


/* =====================================
   HISTORY
===================================== */

var historyList = [];


/* =====================================
   CLOCK
===================================== */

function updateClock() {

    var now = new Date();

    var h = now.getHours();
    var m = now.getMinutes();
    var s = now.getSeconds();

    if (h < 10) {
        h = "0" + h;
    }

    if (m < 10) {
        m = "0" + m;
    }

    if (s < 10) {
        s = "0" + s;
    }

    document.getElementById("clock").innerHTML =
        h + ":" + m + ":" + s;
}


/*
   Update immediately
*/

updateClock();


/*
   Update every second
*/

setInterval(
    updateClock,
    1000
);


/* =====================================
   HIDE PANELS
===================================== */

function hidePanels() {

    document.getElementById(
        "favoriteForm"
    ).style.display = "none";

    document.getElementById(
        "favoritesPanel"
    ).style.display = "none";

    document.getElementById(
        "historyPanel"
    ).style.display = "none";
}


/* =====================================
   OPEN WEBSITE
===================================== */

function go(url) {

    addHistory(url);

    window.location.href = url;
}


/* =====================================
   GOOGLE SEARCH
===================================== */

function searchGoogle() {

    var text =
        document.getElementById(
            "searchBox"
        ).value;

    text =
        text.replace(
            /^\s+|\s+$/g,
            ""
        );

    if (text == "") {
        return;
    }

    var url =
        "https://www.google.com/search?q=" +
        encodeURIComponent(text);

    addHistory(url);

    window.location.href = url;
}


/* =====================================
   BROWSER
===================================== */

function goWebsite() {

    var url =
        document.getElementById(
            "urlBox"
        ).value;

    url =
        url.replace(
            /^\s+|\s+$/g,
            ""
        );

    if (url == "") {
        return;
    }

    if (
        url.indexOf("http://") != 0 &&
        url.indexOf("https://") != 0
    ) {
        url =
            "https://" + url;
    }

    addHistory(url);

    window.location.href = url;
}


/* =====================================
   FAVORITE FORM
===================================== */

function newFavorite() {

    hidePanels();

    document.getElementById(
        "favoriteForm"
    ).style.display = "block";

    document.getElementById(
        "favoriteName"
    ).value = "";

    document.getElementById(
        "favoriteURL"
    ).value = "";
}


function cancelFavorite() {

    document.getElementById(
        "favoriteForm"
    ).style.display = "none";
}


/* =====================================
   SAVE FAVORITE
===================================== */

function saveFavorite() {

    var name =
        document.getElementById(
            "favoriteName"
        ).value;

    var url =
        document.getElementById(
            "favoriteURL"
        ).value;


    name =
        name.replace(
            /^\s+|\s+$/g,
            ""
        );

    url =
        url.replace(
            /^\s+|\s+$/g,
            ""
        );


    if (name == "") {
        return;
    }

    if (url == "") {
        return;
    }


    if (
        url.indexOf("http://") != 0 &&
        url.indexOf("https://") != 0
    ) {
        url =
            "https://" + url;
    }


    favorites.push({

        name: name,

        url: url

    });


    document.getElementById(
        "favoriteForm"
    ).style.display = "none";


    openFavorites();
}


/* =====================================
   OPEN FAVORITES
===================================== */

function openFavorites() {

    hidePanels();

    document.getElementById(
        "favoritesPanel"
    ).style.display = "block";


    var area =
        document.getElementById(
            "favoritesList"
        );


    area.innerHTML = "";


    if (
        favorites.length == 0
    ) {

        area.innerHTML =
            '<div class="message">' +
            '⭐ No favorites yet.' +
            '</div>';

        return;
    }


    var i;


    for (
        i = 0;
        i < favorites.length;
        i++
    ) {

        var item =
            document.createElement(
                "div"
            );

        item.className =
            "item";


        var link =
            document.createElement(
                "a"
            );

        link.href =
            favorites[i].url;

        link.innerHTML =
            "⭐ " +
            favorites[i].name;


        var del =
            document.createElement(
                "button"
            );

        del.className =
            "delete";

        del.innerHTML =
            "✕";


        del.onclick =
            (function(index) {

                return function() {

                    favorites.splice(
                        index,
                        1
                    );

                    openFavorites();
                };

            })(i);


        item.appendChild(
            link
        );

        item.appendChild(
            del
        );

        area.appendChild(
            item
        );
    }
}


/* =====================================
   CLOSE FAVORITES
===================================== */

function closeFavorites() {

    document.getElementById(
        "favoritesPanel"
    ).style.display = "none";
}


/* =====================================
   HISTORY
===================================== */

function addHistory(url) {

    historyList.unshift(url);

    if (
        historyList.length > 20
    ) {

        historyList =
            historyList.slice(
                0,
                20
            );
    }
}


function openHistory() {

    hidePanels();

    document.getElementById(
        "historyPanel"
    ).style.display = "block";


    var area =
        document.getElementById(
            "historyList"
        );


    area.innerHTML = "";


    if (
        historyList.length == 0
    ) {

        area.innerHTML =
            '<div class="message">' +
            '🕘 History is empty.' +
            '</div>';

        return;
    }


    var i;


    for (
        i = 0;
        i < historyList.length;
        i++
    ) {

        var item =
            document.createElement(
                "div"
            );

        item.className =
            "item";


        var link =
            document.createElement(
                "a"
            );

        link.href =
            historyList[i];

        link.innerHTML =
            "🕘 " +
            historyList[i];


        item.appendChild(
            link
        );

        area.appendChild(
            item
        );
    }
}


function clearHistory() {

    historyList = [];

    openHistory();
}


function closeHistory() {

    document.getElementById(
        "historyPanel"
    ).style.display = "none";
}


/* =====================================
   BACK
===================================== */

function goBack() {

    if (
        window.history.length > 1
    ) {

        window.history.back();

    } else {

        window.location.href =
            "https://artinxray.github.io/nokia3210-google/";
    }
}


</script>

</body>
</html>
