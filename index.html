<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0">

<title>Nokia Mini Browser</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;

    background: #000;
    color: #fff;

    font-family: Arial, sans-serif;

    text-align: center;
}


/* =========================
   Nokia Header
========================= */

.nokia-header {

    width: 100%;

    height: 38px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 12px;

    border-bottom: 1px solid #222;

    color: #aaa;

    font-size: 11px;

    letter-spacing: 1px;
}


.nokia-brand {
    color: #fff;
    font-weight: bold;
}


.network {
    color: #666;
}


/* =========================
   Main
========================= */

.main {

    width: 100%;

    padding: 22px 12px 18px 12px;
}


/* =========================
   Google Logo
========================= */

.logo {

    font-size: 46px;

    font-weight: bold;

    letter-spacing: -4px;

    line-height: 1;

    white-space: nowrap;

    margin-bottom: 25px;
}


.blue {
    color: #4285F4;
}

.red {
    color: #EA4335;
}

.yellow {
    color: #FBBC05;
}

.green {
    color: #34A853;
}


/* =========================
   Search
========================= */

.search-box {

    width: 100%;

    height: 48px;

    border: 1px solid #555;

    border-radius: 24px;

    background: #181818;

    display: flex;

    align-items: center;

    padding: 0 10px;
}


#search {

    width: 100%;

    height: 42px;

    border: none;

    outline: none;

    font-size: 16px;

    background: transparent;

    color: #fff;

    order: 1;
}


#search::placeholder {
    color: #888;
}


/* Search Button */

.search-button {

    width: 34px;

    height: 34px;

    border: none;

    background: transparent;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 0;

    margin-left: 5px;

    order: 2;
}


.search-button svg {

    width: 21px;

    height: 21px;

    fill: none;

    stroke: #aaa;

    stroke-width: 2.5;
}


.search-button:active svg {
    stroke: #fff;
}


/* =========================
   Clock
========================= */

#clock {

    font-size: 20px;

    margin-top: 15px;

    color: #fff;
}


/* =========================
   Nokia Status
========================= */

.status {

    margin-top: 8px;

    font-size: 10px;

    color: #555;

    letter-spacing: 1px;
}


/* =========================
   Sections
========================= */

.section {

    margin-top: 18px;

    border-top: 1px solid #222;

    padding-top: 12px;
}


.section-title {

    font-size: 12px;

    color: #888;

    letter-spacing: 1px;

    margin-bottom: 8px;
}


/* =========================
   History / Favorites Items
========================= */

.item {

    width: 100%;

    min-height: 38px;

    margin: 5px 0;

    border: 1px solid #292929;

    border-radius: 7px;

    background: #0d0d0d;

    color: #ccc;

    font-size: 13px;

    text-align: left;

    padding: 9px 10px;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;
}


.item:active {
    background: #202020;
}


/* =========================
   Favorite Button
========================= */

.add-favorite {

    width: 100%;

    height: 40px;

    margin-top: 7px;

    border: 1px solid #292929;

    border-radius: 7px;

    background: #111;

    color: #aaa;

    font-size: 12px;
}


.add-favorite:active {
    background: #222;
}


/* =========================
   Clear
========================= */

.clear {

    margin-top: 7px;

    color: #666;

    font-size: 10px;
}


/* =========================
   Lite
========================= */

.lite {

    margin-top: 20px;

    padding-top: 10px;

    border-top: 1px solid #151515;

    color: #3f3f3f;

    font-size: 9px;

    letter-spacing: 1px;
}

</style>

</head>


<body>


<!-- Nokia Header -->

<div class="nokia-header">

    <div class="nokia-brand">
        NOKIA
    </div>

    <div class="network">
        4G
    </div>

</div>


<div class="main">


    <!-- Google -->

    <div class="logo">

        <span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span>

    </div>


    <!-- Search -->

    <div class="search-box">


        <input
            id="search"
            type="text"
            placeholder="Search or enter website"
            onkeydown="searchKey(event)"
        >


        <button
            class="search-button"
            onclick="openSearch()"
            aria-label="Search">


            <svg viewBox="0 0 24 24">

                <circle
                    cx="10.5"
                    cy="10.5"
                    r="6.5">
                </circle>

                <line
                    x1="16"
                    y1="16"
                    x2="21"
                    y2="21">
                </line>

            </svg>


        </button>


    </div>


    <!-- Clock -->

    <div id="clock">
        00:00:00
    </div>


    <div class="status">
        MINI BROWSER
    </div>


    <!-- History -->

    <div class="section">

        <div class="section-title">
            🕘 HISTORY
        </div>


        <div id="history">

            <div style="color:#444;font-size:11px;">
                No history
            </div>

        </div>


        <div
            class="clear"
            onclick="clearHistory()">

            Clear History

        </div>

    </div>


    <!-- Favorites -->

    <div class="section">

        <div class="section-title">
            ⭐ FAVORITES
        </div>


        <div id="favorites">

            <div style="color:#444;font-size:11px;">
                No favorites
            </div>

        </div>


        <button
            class="add-favorite"
            onclick="addFavorite()">

            + Add current address to Favorites

        </button>


        <div
            class="clear"
            onclick="clearFavorites()">

            Clear Favorites

        </div>

    </div>


    <!-- Lite -->

    <div class="lite">

        NOKIA 3210 4G • MINI BROWSER • LITE

    </div>


</div>



<script>


/* =========================
   Storage
========================= */

var historyList =
    JSON.parse(
        localStorage.getItem(
            "nokia_history"
        ) || "[]"
    );


var favorites =
    JSON.parse(
        localStorage.getItem(
            "nokia_favorites"
        ) || "[]"
    );


/* =========================
   Search
========================= */

function openSearch() {

    var text =
        document.getElementById(
            "search"
        ).value;


    text =
        text.replace(
            /^\s+|\s+$/g,
            ""
        );


    if (text == "") {
        return;
    }


    addHistory(text);


    var isWebsite =
        text.indexOf(".") > 0 ||
        text.indexOf("://") > 0;


    if (isWebsite) {

        var url = text;


        if (
            url.indexOf("://") == -1
        ) {

            url =
                "https://" + url;

        }


        window.location.href = url;


    } else {

        window.location.href =
            "https://www.google.com/search?q=" +
            encodeURIComponent(text);

    }

}


/* =========================
   Enter
========================= */

function searchKey(event) {

    if (event.keyCode == 13) {

        openSearch();

    }

}


/* =========================
   History
========================= */

function addHistory(text) {

    var newList = [];

    newList.push(text);


    for (
        var i = 0;
        i < historyList.length;
        i++
    ) {

        if (
            historyList[i] != text
        ) {

            newList.push(
                historyList[i]
            );

        }

    }


    historyList =
        newList.slice(0, 5);


    localStorage.setItem(
        "nokia_history",
        JSON.stringify(historyList)
    );


    showHistory();

}


function showHistory() {

    var box =
        document.getElementById(
            "history"
        );


    if (
        historyList.length == 0
    ) {

        box.innerHTML =
            '<div style="color:#444;font-size:11px;">No history</div>';

        return;

    }


    var html = "";


    for (
        var i = 0;
        i < historyList.length;
        i++
    ) {

        html +=
            '<div class="item" onclick="useItem(' +
            JSON.stringify(
                historyList[i]
            ) +
            ')">' +
            historyList[i] +
            '</div>';

    }


    box.innerHTML = html;

}


function useItem(text) {

    document.getElementById(
        "search"
    ).value = text;

    openSearch();

}


function clearHistory() {

    historyList = [];

    localStorage.removeItem(
        "nokia_history"
    );

    showHistory();

}


/* =========================
   Favorites
========================= */

function addFavorite() {

    var text =
        document.getElementById(
            "search"
        ).value;


    text =
        text.replace(
            /^\s+|\s+$/g,
            ""
        );


    if (text == "") {
        return;
    }


    for (
        var i = 0;
        i < favorites.length;
        i++
    ) {

        if (
            favorites[i] == text
        ) {

            return;

        }

    }


    favorites.push(text);


    favorites =
        favorites.slice(0, 5);


    localStorage.setItem(
        "nokia_favorites",
        JSON.stringify(favorites)
    );


    showFavorites();

}


function showFavorites() {

    var box =
        document.getElementById(
            "favorites"
        );


    if (
        favorites.length == 0
    ) {

        box.innerHTML =
            '<div style="color:#444;font-size:11px;">No favorites</div>';

        return;

    }


    var html = "";


    for (
        var i = 0;
        i < favorites.length;
        i++
    ) {

        html +=
            '<div class="item" onclick="useFavorite(' +
            JSON.stringify(
                favorites[i]
            ) +
            ')">' +
            "⭐ " +
            favorites[i] +
            '</div>';

    }


    box.innerHTML = html;

}


function useFavorite(text) {

    document.getElementById(
        "search"
    ).value = text;

    openSearch();

}


function clearFavorites() {

    favorites = [];

    localStorage.removeItem(
        "nokia_favorites"
    );

    showFavorites();

}


/* =========================
   Clock
========================= */

function updateClock() {

    var now = new Date();


    var h =
        now.getHours();


    var m =
        now.getMinutes();


    var s =
        now.getSeconds();


    if (h < 10)
        h = "0" + h;


    if (m < 10)
        m = "0" + m;


    if (s < 10)
        s = "0" + s;


    document.getElementById(
        "clock"
    ).innerHTML =
        h + ":" + m + ":" + s;

}


updateClock();


setInterval(
    updateClock,
    1000
);


/* Initial */

showHistory();

showFavorites();

</script>


</body>
</html>
