
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nokia Browser 2.0</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#f5f7fb;color:#202124;
 font-family:Arial,sans-serif;padding:15px;
}
header{display:flex;align-items:center;gap:9px;margin:8px 0 22px}
.logo{
 width:48px;height:48px;border-radius:50%;background:white;
 display:grid;place-items:center;font-size:30px;font-weight:bold;
 box-shadow:0 2px 8px #ddd;
}
.logo span{
 background:linear-gradient(45deg,#4285f4 25%,#34a853 25% 50%,#fbbc05 50% 75%,#ea4335 75%);
 color:transparent;background-clip:text;
}
h1{font-size:22px;margin:0}
h1 span:nth-child(1){color:#4285f4}
h1 span:nth-child(2){color:#ea4335}
h1 span:nth-child(3){color:#fbbc05}
h1 span:nth-child(4){color:#4285f4}
h1 span:nth-child(5){color:#34a853}
h1 span:nth-child(6){color:#ea4335}
.sub{font-size:12px;color:#777;margin-top:4px}
.search{
 background:white;border-radius:24px;padding:8px;
 box-shadow:0 2px 9px #ddd;display:flex;gap:5px;
}
input{
 width:100%;min-width:0;border:0;outline:0;
 font-size:15px;padding:10px 7px;background:transparent;
}
button{
 border:0;border-radius:20px;background:#4285f4;
 color:white;padding:10px 14px;font-size:15px;
}
h3{font-size:15px;margin-top:25px}
.shortcuts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.shortcut{
 padding:13px 5px;background:white;border-radius:12px;
 text-align:center;color:#333;text-decoration:none;
 border:1px solid #e8e8e8;font-size:14px;
}
.shortcut b{display:block;font-size:21px;margin-bottom:6px}
.panel{
 background:white;border-radius:13px;padding:14px;
 margin-top:15px;box-shadow:0 2px 8px #ddd;
}
.full{width:100%;margin-top:9px}
#status{font-size:13px;line-height:1.6;overflow-wrap:anywhere}
.item{padding:9px 0;border-bottom:1px solid #eee;font-size:13px}
.note{font-size:12px;color:#777;line-height:1.6;margin-top:20px}
</style>
</head>
<body>

<header>
 <div class="logo"><span>N</span></div>
 <div>
  <h1><span>N</span><span>o</span><span>k</span><span>i</span><span>a</span> Browser</h1>
  <div class="sub">Simple browser for your Nokia</div>
 </div>
</header>

<form id="searchForm" class="search">
 <input id="address" type="text"
 placeholder="Search or enter website address" autocomplete="off">
 <button type="submit">Go</button>
</form>

<h3>Quick access</h3>
<div class="shortcuts">
 <a class="shortcut" href="https://www.google.com/"><b>🔎</b>Google</a>
 <a class="shortcut" href="https://myftth.tci.ir/"><b>🌐</b>My FTTH</a>
 <a class="shortcut" href="https://www.wikipedia.org/"><b>📘</b>Wikipedia</a>
 <a class="shortcut" href="https://www.youtube.com/"><b>▶️</b>YouTube</a>
</div>

<div class="panel">
 <h3 style="margin-top:0">⬇ Downloads</h3>
 <input id="fileURL" placeholder="Paste direct file URL">
 <button class="full" onclick="downloadFile()">Download File</button>
 <p id="status">Ready to download.</p>
</div>

<div class="panel">
 <h3 style="margin-top:0">Download History</h3>
 <div id="history">No downloads yet.</div>
 <button class="full" onclick="clearHistory()">Clear History</button>
</div>

<p class="note">
Nokia Browser 2.0 · Experimental download manager
</p>

<script>
(function(){
 const form=document.getElementById("searchForm");
 const input=document.getElementById("address");

 function openAddress(value){
  let text=value.trim();
  if(!text)return;

  const hasSpace=/\s/.test(text);
  const isDomain=
   /^https?:\/\//i.test(text) ||
   /^localhost(:\d+)?(\/.*)?$/i.test(text) ||
   /^(\d{1,3}\.){3}\d{1,3}(:\d+)?(\/.*)?$/i.test(text) ||
   /^([a-z0-9-]+\.)+[a-z]{2,}(:\d+)?(\/[^ ]*)?([?#][^ ]*)?$/i.test(text);

  if(isDomain&&!hasSpace){
   if(!/^https?:\/\//i.test(text))text="https://"+text;
   window.location.href=text;
  }else{
   window.location.href="https://www.google.com/search?q="+
   encodeURIComponent(text);
  }
 }

 form.addEventListener("submit",function(e){
  e.preventDefault();
  openAddress(input.value);
 });
})();

function addHistory(name,result){
 let history=document.getElementById("history");
 if(history.innerText==="No downloads yet.")history.innerHTML="";
 let item=document.createElement("div");
 item.className="item";
 item.textContent=name+" — "+result;
 history.prepend(item);
}

function clearHistory(){
 document.getElementById("history").innerHTML="No downloads yet.";
}

async function downloadFile(){
 const url=document.getElementById("fileURL").value.trim();
 const status=document.getElementById("status");

 if(!url){
  status.textContent="Please enter a file URL.";
  return;
 }

 status.textContent="Connecting...";

 try{
  const response=await fetch(url);

  if(!response.ok){
   throw new Error("Server error: "+response.status);
  }

  const blob=await response.blob();
  const objectURL=URL.createObjectURL(blob);

  let name="download";
  try{
   name=new URL(url).pathname.split("/").pop()||name;
  }catch(e){}

  const link=document.createElement("a");
  link.href=objectURL;
  link.download=name;
  link.style.display="none";
  document.body.appendChild(link);
  link.click();
  link.remove();

  status.textContent="Download request sent: "+name;
  addHistory(name,"Requested");

  setTimeout(()=>URL.revokeObjectURL(objectURL),60000);

 }catch(error){
  status.textContent=
   "Download failed: "+error.message+
   ". The website may block access (CORS) or Cloud Phone may block saving.";
  addHistory(url,"Failed");
 }
}
</script>
</body>
</html>
