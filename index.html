<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Hub</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    .header {
        background: #222;
        padding: 10px 5px;
        font-size: 20px;
        font-weight: bold;
    }

    .container {
        padding: 10px;
    }

    button {
        display: block;
        width: 100%;
        margin: 8px 0;
        padding: 12px 5px;
        border: 1px solid #555;
        border-radius: 6px;
        background: #222;
        color: white;
        font-size: 16px;
    }

    button:active {
        background: #444;
    }

    .footer {
        margin-top: 12px;
        font-size: 11px;
        color: #888;
    }
</style>
</head>

<body>

<div class="header">
    GOOGLE HUB
</div>

<div class="container">

    <button onclick="openSite('https://www.google.com/search')">
        🔍 Google Search
    </button>

    <button onclick="openSite('https://www.youtube.com')">
        ▶ YouTube
    </button>

    <button onclick="openSite('https://www.google.com/maps')">
        🗺 Google Maps
    </button>

    <button onclick="openSite('https://mail.google.com')">
        ✉ Gmail
    </button>

    <button onclick="openBrowser()">
        🌐 Open Website
    </button>

</div>

<div class="footer">
    Nokia 3210 • Google Hub
</div>

<script>
function openSite(url) {
    window.location.href = url;
}

function openBrowser() {
    var site = prompt("Enter website:");

    if (site) {
        if (!site.startsWith("http://") &&
            !site.startsWith("https://")) {
            site = "https://" + site;
        }

        window.location.href = site;
    }
}
</script>

</body>
</html>
