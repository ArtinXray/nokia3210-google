
<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nokia Browser</title>

<style>
:root {
    --bg: #ffffff;
    --text: #202124;
    --box: #ffffff;
    --border: #dadce0;
    --panel: #f8f9fa;
}

body.dark {
    --bg: #171717;
    --text: #f1f3f4;
    --box: #202124;
    --border: #5f6368;
    --panel: #292a2d;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, sans-serif;
    transition: background 0.2s, color 0.2s;
}

button, input {
    font-family: inherit;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px;
}

.topbar button {
    background: transparent;
    color: var(--text);
    border: none;
    font-size: 24px;
    padding: 4px 8px;
    cursor: pointer;
}

.logo {
    text-align: center;
    margin-top: 65px;
    margin-bottom: 28px;
}

.logo-nokia {
    color: #4285F4;
    font-size: clamp(36px, 12vw, 48px);
    font-weight: bold;
    letter-spacing: 1px;
}

.logo-browser {
    font-size: 27px;
    font-weight: 500;
    margin-top: 2px;
}

.red { color: #EA4335; }
.yellow { color: #FBBC05; }
.green { color: #34A853; }
.blue { color: #4285F4; }

.search-box {
    display: flex;
    align-items: center;
    width: calc(100% - 28px);
    max-width: 340px;
    height: 44px;
    margin: 0 auto;
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 0 12px;
    background: var(--box);
}

.search-box:focus-within {
    border-color: #4285F4;
}

.search-box input {
    flex: 1;
    min-width: 0;
    height: 100%;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-size: 14px;
    padding: 0 4px;
}

.search-box input::placeholder {
    color: #888;
}

.search-box button {
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 28px;
    cursor: pointer;
    padding: 0 2px;
    line-height: 1;
}

.panel {
    display: none;
    width: calc(100% - 28px);
    max-width: 340px;
    margin: 18px auto;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    background: var(--panel);
}

.panel.show {
    display: block;
}

.panel-title {
    font-weight: bold;
    padding: 12px;
    border-bottom: 1px solid var(--border);
}

.menu-item {
    width: 100%;
    text-align: left;
    border: none;
    border-bottom: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    padding: 12px;
    font-size: 14px;
    cursor: pointer;
}

.menu-item:last-child {
    border-bottom: none;
}

.menu-item:active {
    background: var(--border);
}

.entry {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
}

.entry:last-child {
    border-bottom: none;
}

.entry-name {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
    font-size: 13px;
    cursor: pointer;
}

.delete-btn {
    background: transparent;
    color: var(--text);
    border: none;
    font-size: 18px;
    cursor: pointer;
    padding: 3px 6px;
}

.empty {
    padding: 14px;
    color: #888;
    font-size: 13px;
    text-align: center;
}

.clear-btn {
    width: 100%;
    border: none;
    border-top: 1px solid var(--border);
    background: transparent;
    color: #4285F4;
    padding: 11px;
    cursor: pointer;
}

@media (max-height: 500px) {
    .logo {
        margin-top: 22px;
        margin-bottom: 18px;
    }
}
</style>
</head>

<body>

<div class="topbar">
    <button id="themeBtn" aria-label="تغییر تم" onclick="toggleTheme()">☾</button>
    <button aria-label="منو" onclick="toggleMenu()">⋮</button>
</div>

<div class="logo" aria-label="Nokia Browser">
    <div class="logo-nokia">NOKIA</div>
    <div class="logo-browser">
        <span class="red">B</span><span class="yellow">r</span><span class="green">o</span><span class="blue">w</span><span class="red">s</span><span class="yellow">e</span><span class="green">r</span>
    </div>
</div>

<form class="search-box" onsubmit="searchGoogle(); return false;">
    <input
        type="text"
        id="searchInput"
        placeholder="Search Google..."
        autocomplete="off"
    >
    <button type="submit" aria-label="جست‌وجو">⌕</button>
</form>

<div class="panel" id="menuPanel">
    <button class="menu-item" onclick="showHistory()">🕘 History</button>
    <button class="menu-item" onclick="showFavorites()">★ Favorites</button>
    <button class="menu-item" onclick="addFavorite()">＋ Add to Favorites</button>
</div>

<div class="panel" id="historyPanel">
    <div class="panel-title">History</div>
    <div id="historyList"></div>
    <button class="clear-btn" onclick="clearHistory()">Clear All</button>
</div>

<div class="panel" id="favoritesPanel">
    <div class="panel-title">Favorites</div>
    <div id="favoritesList"></div>
</div>

<script>
const HISTORY_KEY = "nokia_history";
const FAVORITES_KEY = "nokia_favorites";
const THEME_KEY = "nokia_lite";

function getList(key) {
    try {
        const data = JSON.parse(localStorage.getItem(key) || "[]");
        return Array.isArray(data) ? data : [];
    } catch (e) {
        return [];
    }
}

function saveList(key, list) {
    localStorage.setItem(key, JSON.stringify(list));
}

function searchGoogle() {
    const input = document.getElementById("searchInput");
    const query = input.value.trim();

    if (!query) {
        input.focus();
        return;
    }

    let destination;

    if (/^https?:\/\//i.test(query)) {
        destination = query;
    } else if (/^[\w-]+\.[a-z]{2,}(\/.*)?$/i.test(query) && !query.includes(" ")) {
        destination = "https://" + query;
    } else {
        destination = "https://www.google.com/search?q=" +
            encodeURIComponent(query);
    }

    let history = getList(HISTORY_KEY);
    history = history.filter(item => item !== destination);
    history.unshift(destination);
    saveList(HISTORY_KEY, history.slice(0, 5));

    window.location.href = destination;
}

function toggleTheme() {
    document.body.classList.toggle("dark");

    const dark = document.body.classList.contains("dark");
    localStorage.setItem(THEME_KEY, dark ? "dark" : "light");
    updateThemeButton();
}

function updateThemeButton() {
    const dark = document.body.classList.contains("dark");
    document.getElementById("themeBtn").textContent = dark ? "☀" : "☾";
}

function loadTheme() {
    if (localStorage.getItem(THEME_KEY) === "dark") {
        document.body.classList.add("dark");
    }
    updateThemeButton();
}

function hidePanels() {
    ["menuPanel", "historyPanel", "favoritesPanel"].forEach(id => {
        document.getElementById(id).classList.remove("show");
    });
}

function toggleMenu() {
    const panel = document.getElementById("menuPanel");
    const wasOpen = panel.classList.contains("show");
    hidePanels();

    if (!wasOpen) {
        panel.classList.add("show");
    }
}

function showHistory() {
    hidePanels();
    renderHistory();
    document.getElementById("historyPanel").classList.add("show");
}

function showFavorites() {
    hidePanels();
    renderFavorites();
    document.getElementById("favoritesPanel").classList.add("show");
}

function renderList(key, containerId, emptyText) {
    const container = document.getElementById(containerId);
    const items = getList(key);
    container.innerHTML = "";

    if (items.length === 0) {
        container.innerHTML = '<div class="empty">' + emptyText + '</div>';
        return;
    }

    items.forEach((item, index) => {
        const row = document.createElement("div");
        row.className = "entry";

        const name = document.createElement("div");
        name.className = "entry-name";
        name.textContent = item;
        name.title = item;
        name.onclick = () => {
            window.location.href = item;
        };

        const remove = document.createElement("button");
        remove.className = "delete-btn";
        remove.textContent = "×";
        remove.setAttribute("aria-label", "حذف");
        remove.onclick = () => {
            const updated = getList(key);
            updated.splice(index, 1);
            saveList(key, updated);

            if (key === HISTORY_KEY) {
                renderHistory();
            } else {
                renderFavorites();
            }
        };

        row.appendChild(name);
        row.appendChild(remove);
        container.appendChild(row);
    });
}

function renderHistory() {
    renderList(HISTORY_KEY, "historyList", "No history yet");
}

function renderFavorites() {
    renderList(FAVORITES_KEY, "favoritesList", "No favorites yet");
}

function clearHistory() {
    saveList(HISTORY_KEY, []);
    renderHistory();
}

function addFavorite() {
    const input = document.getElementById("searchInput");
    const query = input.value.trim();

    if (!query) {
        alert("First enter a website or search term.");
        input.focus();
        return;
    }

    let destination;

    if (/^https?:\/\//i.test(query)) {
        destination = query;
    } else if (/^[\w-]+\.[a-z]{2,}(\/.*)?$/i.test(query) && !query.includes(" ")) {
        destination = "https://" + query;
    } else {
        destination = "https://www.google.com/search?q=" +
            encodeURIComponent(query);
    }

    let favorites = getList(FAVORITES_KEY);

    if (favorites.includes(destination)) {
        alert("Already in Favorites.");
        return;
    }

    if (favorites.length >= 5) {
        alert("Favorites is full. Delete one before adding another.");
        return;
    }

    favorites.unshift(destination);
    saveList(FAVORITES_KEY, favorites);
    hidePanels();
    showFavorites();
}

document.getElementById("searchInput").addEventListener("keydown", function(event) {
    if (event.key === "Escape") {
        this.value = "";
    }
});

loadTheme();
</script>

</body>
</html>
